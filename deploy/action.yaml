name: Deploy Genesis
description: Deploys a specific version of Genesis to a server

inputs:
  version:
    required: true
  environment:
    required: true
  config-path:
    required: true
  migrate_db:
    required: false
    type: boolean
    default: true
  app_name:
    required: true
  ecr_registry:
    required: true
  aws-access-key-id:
    required: true
  aws-secret-access-key:
    required: true
  aws-region:
    required: true

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4

    - name: Stop Genesis
      uses: genesislcap/appdev-workflows/ssm-command@ferreirar/docker-tag
      with:
        command: "cd /data/docker-compose && docker compose down || exit 0"
        environment: ${{ inputs.environment }}
        fail_if_instance_not_running: false
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}

    - name: Start Instance if not running
      shell: bash
      run: |
        INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:Environment,Values=$ENVIRONMENT_TAG" "Name=instance-state-name,Values=stopped" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text)

        if [ -z "$INSTANCE_IDS" ]; then
          echo "✅ No instance at stopped status"
        fi
        
        for INSTANCE_ID in $INSTANCE_IDS; do
          STATUS=$(aws ec2 start-instances --instance-ids $INSTANCE_ID --output text)

          echo "Instance $INSTANCE_ID: $STATUS"

          if [ "$STATUS" != "Success" ]; then
              echo "❌ Failed to start instance $INSTANCE_ID, aborting"
              exit 1
          fi
        done

    - name: Sync config files
      uses: genesislcap/appdev-workflows/sync-files@develop
      with:
        local-path: ${{ inputs.config-path }}
        remote-path: "/data/docker-compose"
        environment: ${{ inputs.environment }}
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}

    - name: Run DB Migration
      if: ${{ inputs.migrate_db }}
      uses: genesislcap/appdev-workflows/ssm-command@develop
      with:
        command:
          source /root/.bashrc &&
          cd /data/docker-compose &&
          populate_secrets &&
          GENESIS_VERSION=${{ inputs.version }}
          APP_NAME=${{ inputs.app_name }}
          AWS_ECR_REGISTRY=${{ inputs.ecr_registry }}
          docker compose run --rm -e GENESIS_DB_INSTALL=true genesis_app
        run_on_all: false
        environment: ${{ inputs.environment }}
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}

    - name: Start Genesis
      uses: genesislcap/appdev-workflows/ssm-command@develop
      with:
        command:
          source /root/.bashrc &&
          cd /data/docker-compose &&
          populate_secrets &&
          GENESIS_VERSION=${{ inputs.version }}
          APP_NAME=${{ inputs.app_name }}
          AWS_ECR_REGISTRY=${{ inputs.ecr_registry }}
          docker compose up -d
        environment: ${{ inputs.environment }}
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}
