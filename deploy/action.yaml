name: Deploy Genesis
description: Deploys a specific version of Genesis to a server

inputs:
  version:
    required: true
    description: The image version to deploy
  environment:
    required: true
    description: The environment tag used to identify the servers to deploy to
  config-path:
    required: true
    description: The path of the Docker Compose file and supporting configs
  migrate_db:
    description: Whether to run remap or not
    required: false
    default: "true"
  initial_deploy:
    description: Whether to initiate the DB and set all hooks be ignored and set to completed
    required: false
    default: "false"
  backup_db:
    description: Use Genesis DumpIt and copy to S3 (Should not be used in Prod)
    required: false
    default: "false"
  snapshot_rds:
    description: Whether to initiate the rds snapshot creation
    required: false
    default: "false"
  custom_env_vars:
    description: Cutom env vars that will be passed to the Docker Compose command. Provide as multiline key/value pair.
    required: false
    default: ""
  app_name:
    required: true
  ecr_registry:
    required: true
  aws-access-key-id:
    required: true
  aws-secret-access-key:
    required: true
  aws-region:
    required: true
  customer:
    required: false

runs:
  using: "composite"
  steps:
    - name: Start instance if not running
      uses: genesislcap/appdev-workflows/start-stop-instances@develop
      with:
        command: "start"
        app_name: ${{ inputs.app_name }}
        environment: ${{ inputs.environment }}
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}

    - shell: bash
      run: |
        echo "- ✅ Instances Started" >> $GITHUB_STEP_SUMMARY

    - name: Stop Genesis
      uses: genesislcap/appdev-workflows/ssm-command@develop
      with:
        command: "cd /data/docker-compose && docker compose down || exit 0"
        app_name: ${{ inputs.app_name }}
        environment: ${{ inputs.environment }}
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}

    - shell: bash
      run: |
        echo "- ✅ Genesis Stopped" >> $GITHUB_STEP_SUMMARY

    - name: RDS Snapshot step
      if: inputs.snapshot_rds == 'true'
      uses: genesislcap/appdev-workflows/rds-snapshot@DCD-3464
      with:
        app_name: ${{ inputs.app_name }}
        customer: ${{ inputs.customer }}
        environment: ${{ inputs.environment }}
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}

    - shell: bash
      if: inputs.snapshot_rds == 'true'
      run: |
        echo "- ✅ RDS Snapshot Completed" >> $GITHUB_STEP_SUMMARY

    - name: Backup DB
      if: inputs.backup_db == 'true'
      uses: genesislcap/appdev-workflows/backup-db@develop
      with:
        app_name: ${{ inputs.app_name }}
        environment: ${{ inputs.environment }}
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}

    - shell: bash
      if: inputs.backup_db == 'true'
      run: |
        echo "- ✅ Genesis DumpIt Completed" >> $GITHUB_STEP_SUMMARY

    - name: Sync config files
      uses: genesislcap/appdev-workflows/sync-files@develop
      with:
        local-path: ${{ inputs.config-path }}
        remote-path: "/data/docker-compose"
        app_name: ${{ inputs.app_name }}
        environment: ${{ inputs.environment }}
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}

    - shell: bash
      run: |
        echo "- ✅ Environment Synced" >> $GITHUB_STEP_SUMMARY

    - name: Populate secrets & Docker Compose env vars
      uses: genesislcap/appdev-workflows/ssm-command@develop
      with:
        command: |
          rm -rf /etc/profile.d/deploy.sh # Remove old config

          echo 'export GENESIS_VERSION=${{ inputs.version }}' >> /etc/profile.d/deploy.sh
          echo 'export APP_NAME=${{ inputs.app_name }}' >> /etc/profile.d/deploy.sh
          echo 'export AWS_ECR_REGISTRY=${{ inputs.ecr_registry }}' >> /etc/profile.d/deploy.sh

          echo '${{ inputs.custom_env_vars }}' | while IFS='=' read -r key value; do
            if [[ -n $key ]]; then
              printf 'export %s=%s #DEPLOY_ENV_VAR\n' $key $value >> /etc/profile.d/deploy.sh
            fi
          done

          source /root/.bashrc
          source /etc/profile.d/deploy.sh
          populate_secrets

        app_name: ${{ inputs.app_name }}
        environment: ${{ inputs.environment }}
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}

    - shell: bash
      run: |
        echo "- ✅ Secrets Populated" >> $GITHUB_STEP_SUMMARY

    - name: Initiate the DB
      if: inputs.initial_deploy == 'true'
      uses: genesislcap/appdev-workflows/ssm-command@develop
      with:
        command:
          source /root/.bashrc &&
          cd /data/docker-compose &&
          docker compose run --rm -e GENESIS_DB_INSTALL=true genesis_app
        app_name: ${{ inputs.app_name }}
        run_on_all: false
        environment: ${{ inputs.environment }}
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}

    - shell: bash
      if: inputs.initial_deploy == 'true'
      run: |
        echo "- ✅ DB Initialisation Completed (remap and mark install hooks as completed)" >> $GITHUB_STEP_SUMMARY

    - name: Run DB Migration
      if: inputs.migrate_db == 'true'
      uses: genesislcap/appdev-workflows/ssm-command@develop
      with:
        command:
          source /root/.bashrc &&
          cd /data/docker-compose &&
          docker compose run --rm -e GENESIS_DB_UPGRADE=true genesis_app
        app_name: ${{ inputs.app_name }}
        run_on_all: false
        environment: ${{ inputs.environment }}
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}

    - shell: bash
      if: inputs.migrate_db == 'true'
      run: |
        echo "- ✅ DB Migration Completed (remap)" >> $GITHUB_STEP_SUMMARY

    - name: Start Genesis
      uses: genesislcap/appdev-workflows/ssm-command@develop
      with:
        command:
          source /root/.bashrc &&
          cd /data/docker-compose &&
          docker compose up -d
        app_name: ${{ inputs.app_name }}
        environment: ${{ inputs.environment }}
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}

    - shell: bash
      run: |
        echo "- ✅ Genesis Started" >> $GITHUB_STEP_SUMMARY

    - name: Prune Docker
      uses: genesislcap/appdev-workflows/ssm-command@develop
      with:
        command: docker system prune -af && docker volume prune -af
        app_name: ${{ inputs.app_name }}
        environment: ${{ inputs.environment }}
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}

    - shell: bash
      run: |
        echo "- ✅ Docker Pruned" >> $GITHUB_STEP_SUMMARY
