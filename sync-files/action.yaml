name: Sync Files
description: Sync the config files for the Docker Compose environment

inputs:
  local-path:
    required: true
  remote-path:
    required: true
  environment:
    required: true
  app_name:
    required: true
  aws-access-key-id:
    required: true
  aws-secret-access-key:
    required: true
  aws-region:
    required: true

runs:
  using: "composite"
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}

    - name: Find S3 bucket by tags
      id: find-bucket
      shell: bash
      run: |
        # Find S3 bucket by tags
        ENVIRONMENT="${{ inputs.environment }}"
        APP_NAME="${{ inputs.app_name }}"

        # Fetch resources with the specified tag key and value
        BUCKET_ARN=$(aws resourcegroupstaggingapi get-resources \
          --tag-filters Key=EnvironmentName,Values=$ENVIRONMENT Key=AppName,Values=$APP_NAME Key=Type,Values=configs\
          --resource-type-filters s3 \
          --query 'ResourceTagMappingList[0].ResourceARN' \
          --output text)

        if [ "$BUCKET_ARN" == "None" ]; then
          echo "Error: No bucket found with the specified tags."
          exit 1
        fi

        # Extract bucket name from ARN (arn:aws:s3:::bucket-name)
        BUCKET_NAME=$(echo $BUCKET_ARN | cut -d':' -f6)
        echo "Bucket found: $BUCKET_NAME"

        # Set the bucket name as an output
        echo "bucket-name=$BUCKET_NAME" >> $GITHUB_OUTPUT

    - name: Upload the files
      shell: bash
      run: |
        aws s3 sync ./${{ inputs.local-path }} s3://${{ steps.find-bucket.outputs.bucket-name }} --delete --exact-timestamps
        sleep 5

    - uses: genesislcap/appdev-workflows/ssm-command@develop
      with:
        command: |
          aws s3 sync s3://${{ steps.find-bucket.outputs.bucket-name }} ${{ inputs.remote-path }} --delete --exact-timestamps && \
          chmod -R 777 ${{ inputs.remote-path }}
        environment: ${{ inputs.environment }}
        app_name: ${{ inputs.app_name }}
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}
