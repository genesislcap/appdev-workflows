name: Run SAST
description: Run Bearer SAST, upload the SARIF report, and optionally fail for High or Critical findings

inputs:
  working-directory:
    required: false
    default: "."

  app-name:
    required: true

  fail-build:
    description: Fail the workflow when Bearer finds High or Critical findings
    required: false
    default: "false"

runs:
  using: composite

  steps:
    - name: Prepare SAST report path
      id: report
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      run: |
        set -euo pipefail

        REPORT_FILE="sast-report-${{ inputs.app-name }}-${{ github.run_number }}.sarif"
        REPORT_PATH="$PWD/$REPORT_FILE"

        echo "report_file=$REPORT_PATH" >> "$GITHUB_OUTPUT"

    - name: Install SAST CLI
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      run: |
        set -euo pipefail

        curl -sfL \
          https://raw.githubusercontent.com/Bearer/bearer/main/contrib/install.sh |
          sh -s -- latest

        echo "$PWD/bin" >> "$GITHUB_PATH"

    - name: Run SAST security scan
      id: sast_scan
    - name: Run SAST security scan
      id: sast_scan
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      run: |
        set -euo pipefail

        REPORT_PATH="${{ steps.report.outputs.report_file }}"
      shell: bash
      run: |
        set -uo pipefail

        REPORT_PATH="${{ steps.report.outputs.report_file }}"

        set +e

        bearer scan . \
          --scanner sast \
          --report security \
          --format sarif \
          --output "$REPORT_PATH" \
          --severity critical,high,medium,low,warning \
          --fail-on-severity critical,high \
          --exit-code 1

        SCAN_EXIT_CODE=$?

        set -e

        echo "scan_exit_code=$SCAN_EXIT_CODE" >> "$GITHUB_OUTPUT"

        if [ ! -s "$REPORT_PATH" ]; then
          cat > "$REPORT_PATH" <<EOF
        {
          "\$schema": "https://json.schemastore.org/sarif-2.1.0.json",
          "version": "2.1.0",
          "runs": []
        }
        EOF
        fi

        exit 0

    - name: Upload SAST security report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sast-report-${{ inputs.app-name }}-${{ github.run_number }}
        path: ${{ steps.report.outputs.report_file }}
        if-no-files-found: warn

    - name: Evaluate SAST vulnerability threshold
      if: always()
      shell: bash
      run: |
        set -euo pipefail

        SCAN_EXIT_CODE="${{ steps.sast_scan.outputs.scan_exit_code }}"
        FAIL_BUILD="${{ inputs.fail-build }}"

        if [ -z "$SCAN_EXIT_CODE" ]; then
          echo "::error::SAST scan did not complete."
          exit 1
        fi

        if ! [[ "$SCAN_EXIT_CODE" =~ ^[0-9]+$ ]]; then
          echo "::error::Invalid SAST scan exit code: $SCAN_EXIT_CODE"
          exit 1
        fi

        if [ "$SCAN_EXIT_CODE" -ne 0 ]; then
          if [ "$FAIL_BUILD" = "true" ]; then
            echo "::error::SAST found High or Critical security findings."
            exit 1
          fi

          echo "::warning::SAST found High or Critical security findings. Blocking is disabled."
          exit 0
        fi

        echo "No High or Critical SAST findings detected."