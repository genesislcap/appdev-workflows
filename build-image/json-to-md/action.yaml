name: "Convert JFrog JSON scan to Markdown"
description: "Reads JFrog JSON scan output and converts it into GitHub Markdown with HTML tables"

inputs:
  json_path:
    description: "Path to the JFrog JSON scan result"
    required: true
  output_md:
    description: "Output markdown file path"
    default: "scan-summary.md"

runs:
  using: "composite"
  steps:
    - name: Convert JSON to Markdown
      shell: bash
      run: |
        JSON_FILE="${{ inputs.json_path }}"
        MD_FILE="${{ inputs.output_md }}"

        set -o nounset
        set -o pipefail
        
        JSON_FILE="${{ inputs.json_path }}"
        MD_FILE="${{ inputs.output_md }}"
        BASE_URL="https://genesisglobal.jfrog.io/ui/onDemandScanning"
        
        if [ ! -f "$JSON_FILE" ]; then
          echo "JSON file not found: $JSON_FILE"
          exit 1
        fi
        
        # -------------------------------
        # jq helpers
        # -------------------------------
        jq_str() {
          jq -r "$1 // empty" "$JSON_FILE" 2>/dev/null || true
        }
        
        jq_num() {
          jq -r "$1 // 0" "$JSON_FILE" 2>/dev/null || echo 0
        }
        
        jq_sum() {
          jq -r '
            '"$1"'?
            | to_entries?
            | map(.value)?
            | add?
            // 0
          ' "$JSON_FILE" 2>/dev/null || echo 0
        }
        
        # -------------------------------
        # Extract fields safely
        # -------------------------------
        TARGET=$(jq_str '.summary.scans[0]?.target')
        NAME=$(jq_str '.summary.scans[0]?.name')
        SCAN_ID=$(jq_str '.summary.scans[0]?.vulnerabilities?.sca?.scan_ids?[0]')
        
        SCAN_URL=""
        if [ -n "$SCAN_ID" ]; then
          SCAN_URL="${BASE_URL}/${SCAN_ID}"
        fi
        
        HIGH_VULN=$(jq_sum '.summary.scans[0]?.vulnerabilities?.sca?.security?.High')
        MED_VULN=$(jq_sum '.summary.scans[0]?.vulnerabilities?.sca?.security?.Medium')
        
        HIGH_VIOL=$(jq_sum '.summary.scans[0]?.violations?.sca?.security?.High')
        CRIT_LICENSE=$(jq_sum '.summary.scans[0]?.violations?.sca?.license?.Critical')
        
        # -------------------------------
        # Write markdown
        # -------------------------------
        : > "$MD_FILE"
        
        printf '%s\n' "# 🔍 JFrog Scan Summary" >> "$MD_FILE"
        printf '\n' >> "$MD_FILE"
        
        [ -n "$TARGET" ] && printf '%s\n' "**Target:** \`$TARGET\`" >> "$MD_FILE"
        [ -n "$NAME" ]   && printf '%s\n' "**Name:** \`$NAME\`" >> "$MD_FILE"
        
        printf '\n' >> "$MD_FILE"
        
        if [ -n "$SCAN_URL" ]; then
          printf '%s\n\n' "**📄 Full Scan Report:** <a href=\"$SCAN_URL\">View in JFrog Xray</a>" >> "$MD_FILE"
        fi
        
        printf '%s\n\n' "---" >> "$MD_FILE"
        
        # -------------------------------
        # Vulnerabilities
        # -------------------------------
        printf '%s\n\n' "## 🛡️ Vulnerabilities" >> "$MD_FILE"
        printf '%s\n' "<table>" >> "$MD_FILE"
        printf '%s\n' "  <tr><th>Severity</th><th>Count</th></tr>" >> "$MD_FILE"
        printf '%s\n' "  <tr><td>High</td><td>${HIGH_VULN}</td></tr>" >> "$MD_FILE"
        printf '%s\n' "  <tr><td>Medium</td><td>${MED_VULN}</td></tr>" >> "$MD_FILE"
        printf '%s\n\n' "</table>" >> "$MD_FILE"
        
        # -------------------------------
        # Violations
        # -------------------------------
        printf '%s\n\n' "## 🚨 Violations" >> "$MD_FILE"
        printf '%s\n' "<table>" >> "$MD_FILE"
        printf '%s\n' "  <tr><th>Type</th><th>Severity</th><th>Count</th></tr>" >> "$MD_FILE"
        printf '%s\n' "  <tr><td>Security</td><td>High</td><td>${HIGH_VIOL}</td></tr>" >> "$MD_FILE"
        printf '%s\n' "  <tr><td>License</td><td>Critical</td><td>${CRIT_LICENSE}</td></tr>" >> "$MD_FILE"
        printf '%s\n\n' "</table>" >> "$MD_FILE"
        
        printf '%s\n\n' "---" >> "$MD_FILE"
        
        echo "Wrote markdown to $MD_FILE"
        
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ] && [ -f "$MD_FILE" ]; then
          cat "$MD_FILE" >> "$GITHUB_STEP_SUMMARY"
          echo "Appended markdown to GitHub Actions summary."
        fi
