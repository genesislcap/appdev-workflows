name: "Convert JFrog JSON scan to Markdown"
description: "Reads JFrog JSON scan output and converts it into GitHub Markdown with HTML tables"

inputs:
  json_path:
    description: "Path to the JFrog JSON scan result"
    required: true
  output_md:
    description: "Output markdown file path"
    default: "scan-summary.md"

runs:
  using: "composite"
  steps:
    - name: Convert JSON to Markdown
      shell: bash
      run: |
        JSON_FILE="${{ inputs.json_path }}"
        MD_FILE="${{ inputs.output_md }}"

        set -o nounset
        set -o pipefail
        
        JSON_FILE="${{ inputs.json_path }}"
        MD_FILE="${{ inputs.output_md }}"
        BASE_URL="https://genesisglobal.jfrog.io/ui/onDemandScanning"
        
        if [ ! -f "$JSON_FILE" ]; then
          echo "JSON file not found: $JSON_FILE"
          exit 1
        fi
        
        # -------------------------------
        # jq helpers
        # -------------------------------
        ROOT_FILE="$(mktemp)"
        jq '
          if type == "array" then
            (map(select(type == "object"))[0] // {})
          elif type == "object" then
            .
          else
            {}
          end
        ' "$JSON_FILE" > "$ROOT_FILE"

        jq_str() {
          jq -r "$1 // empty" "$ROOT_FILE" 2>/dev/null || true
        }

        jq_count() {
          jq -r "[ $1 ] | length" "$ROOT_FILE" 2>/dev/null || echo 0
        }
        
        # -------------------------------
        # Extract counts safely
        # -------------------------------

        CRIT_VULN=$(jq_count '.vulnerabilities[]? | select(.severity == "Critical")')
        HIGH_VULN=$(jq_count '.vulnerabilities[]? | select(.severity == "High")')
        
        HIGH_VIOL=$(jq_count '.violations[]? | select((.type // .category // "") == "Security" and (.severity // "") == "High")')
        CRIT_LICENSE=$(jq_count '.licenses[]? | select((.severity // .license_severity // "") == "Critical")')
        
        # -------------------------------
        # Write markdown
        # -------------------------------
        : > "$MD_FILE"
        
        printf '%s\n' "# 🔍 JFrog Scan Summary" >> "$MD_FILE"
        printf '\n' >> "$MD_FILE"
        
        
        printf '%s\n\n' "---" >> "$MD_FILE"
        
        # -------------------------------
        # Vulnerabilities
        # -------------------------------
        printf '%s\n\n' "## 🛡️ Vulnerabilities" >> "$MD_FILE"
        printf '%s\n' "<table>" >> "$MD_FILE"
        printf '%s\n' "  <tr><th>Severity</th><th>Count</th></tr>" >> "$MD_FILE"
        printf '%s\n' "  <tr><td>Critical</td><td>${CRIT_VULN}</td></tr>" >> "$MD_FILE"
        printf '%s\n' "  <tr><td>High</td><td>${HIGH_VULN}</td></tr>" >> "$MD_FILE"
        printf '%s\n\n' "</table>" >> "$MD_FILE"
        
        # -------------------------------
        # Violations
        # -------------------------------
        printf '%s\n\n' "## 🚨 Violations" >> "$MD_FILE"
        printf '%s\n' "<table>" >> "$MD_FILE"
        printf '%s\n' "  <tr><th>Type</th><th>Severity</th><th>Count</th></tr>" >> "$MD_FILE"
        printf '%s\n' "  <tr><td>Security</td><td>High</td><td>${HIGH_VIOL}</td></tr>" >> "$MD_FILE"
        printf '%s\n' "  <tr><td>License</td><td>Critical</td><td>${CRIT_LICENSE}</td></tr>" >> "$MD_FILE"
        printf '%s\n\n' "</table>" >> "$MD_FILE"
        
        printf '%s\n\n' "---" >> "$MD_FILE"
        
        echo "Wrote markdown to $MD_FILE"
        
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ] && [ -f "$MD_FILE" ]; then
          cat "$MD_FILE" >> "$GITHUB_STEP_SUMMARY"
          echo "Appended markdown to GitHub Actions summary."
        fi

        rm -f "$ROOT_FILE"
