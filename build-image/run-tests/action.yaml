name: Run Tests
description: Run tests and upload results as GH artifact

inputs:
  version:
    required: true
  jfrog-username:
    required: true
  jfrog-password:
    required: true
  test-reports-suffix:
    required: false
    default: ""
  working-directory:
    default: .
    required: false
  server-path:
    default: server
    required: false

runs:
  using: "composite"
  steps:
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Run tests
      shell: bash
      working-directory: ${{ inputs.working-directory }}/${{ inputs.server-path }}/
      run: |
        ./gradlew test -Pversion=${{ inputs.version }} --no-configuration-cache --no-build-cache --stacktrace -PgenesisArtifactoryUser="${{ inputs.jfrog-username }}" -PgenesisArtifactoryPassword="${{ inputs.jfrog-password }}"

    - name: Upload Test Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-reports${{ inputs.test-reports-suffix }}
        path: "${{ format('{0}/*/build/reports/**/*', inputs.working-directory == '.' && format('{0}/{1}', github.workspace, inputs.server-path) || format('{0}/{1}/{2}', github.workspace, replace(inputs.working-directory, './', ''), inputs.server-path)) }}"

    - name: Publish All Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: |
          ./**/surefire-reports/**/*.xml
          ./**/build/test-results/**/*.xml
        fail_on: nothing
        report_suite_logs: any
