name: Scan with JFrog
description: Scan the distribution for vulnerabilities and licences

inputs:
  version:
    required: true
  jfrog-username:
    required: true
  jfrog-password:
    required: true
  working-directory:
    default: .
    required: false
  server-path:
    default: server
    required: false

runs:
  using: "composite"
  steps:
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - uses: jfrog/setup-jfrog-cli@v4
      env:
        JF_URL: https://genesisglobal.jfrog.io
        JF_USER: ${{ inputs.jfrog-username }}
        JF_PASSWORD: ${{ inputs.jfrog-password }}

    - name: Check if appDistZip exists
      shell: bash
      id: check_task
      working-directory: ${{ inputs.working-directory }}/${{ inputs.server-path }}/
      run: |
        if ./gradlew tasks --all -Pversion=${{ inputs.version }} -PgenesisArtifactoryUser="${{ inputs.jfrog-username }}" -PgenesisArtifactoryPassword="${{ inputs.jfrog-password }}" --no-daemon | grep -q "appDistZip"; then
          echo "appDistZip=true" >> $GITHUB_OUTPUT
        else
          echo "appDistZip=false" >> $GITHUB_OUTPUT
        fi

    - name: Build the dist
      if: steps.check_task.outputs.appDistZip == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}/${{ inputs.server-path }}/
      run: |
        ./gradlew appDistZip -Pversion=${{ inputs.version }} -PgenesisArtifactoryUser="${{ inputs.jfrog-username }}" -PgenesisArtifactoryPassword="${{ inputs.jfrog-password }}" --no-daemon

    - name: Run the JFrog scan
      if: steps.check_task.outputs.appDistZip == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}/${{ inputs.server-path }}/
      run: |
        jf s --licenses --vuln --watches "scan" */build/dist/*.zip

    - name: Get output status filename
      if: steps.check_task.outputs.appDistZip == 'true'
      shell: bash
      id: status_filename
      run: |
        filename=$(ls $JFROG_CLI_COMMAND_SUMMARY_OUTPUT_DIR/jfrog-command-summary/security/binaries-scans/)
        echo "filename=$JFROG_CLI_COMMAND_SUMMARY_OUTPUT_DIR/jfrog-command-summary/security/binaries-scans/$filename" >> $GITHUB_OUTPUT

    - name: Create markdown summary
      if: steps.check_task.outputs.appDistZip == 'true'
      uses: genesislcap/appdev-workflows/build-image/json-to-md@develop
      with:
        json_path: ${{ steps.status_filename.outputs.filename }}
        
    # -----------------------------
    # stgenerate table scan
    # -----------------------------
    - name: Generate scan table report
      if: steps.check_task.outputs.appDistZip == 'true'
      id: table_report
      shell: bash
      working-directory: ${{ inputs.working-directory }}/${{ inputs.server-path }}/
      run: |
        TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")
        TABLE_REPORT="jfrog-scan-table-${TIMESTAMP}.txt"

        # Run JFrog scan in table format
        jf s --vuln --watches "scan" --format=table */build/dist/*.zip | tee $TABLE_REPORT

        # Move the report to the repo root so upload-artifact can use it
        mv $TABLE_REPORT $GITHUB_WORKSPACE/

        # Expose the filename
        echo "table_report_file=$GITHUB_WORKSPACE/$TABLE_REPORT" >> $GITHUB_OUTPUT

    - name: Upload JFrog scan table report
      if: steps.check_task.outputs.appDistZip == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: xray-dependencies-scan
        path: ${{ steps.table_report.outputs.table_report_file }}
