name: Scan with JFrog
description: Scan the distribution for vulnerabilities and licences

inputs:
  version:
    required: true
  jfrog-username:
    required: true
  jfrog-password:
    required: true
  working-directory:
    default: .
    required: false
  server-path:
    default: server
    required: false
  build-server-arguments:
    type: string
    description: Additional arguments/properties to be passed to the appDistZip gradle task
    required: false
  app-name:
    required: false

runs:
  using: "composite"
  steps:
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - uses: jfrog/setup-jfrog-cli@v4
      env:
        JF_URL: https://genesisglobal.jfrog.io
        JF_USER: ${{ inputs.jfrog-username }}
        JF_PASSWORD: ${{ inputs.jfrog-password }}

    - name: Check if appDistZip exists
      shell: bash
      id: check_task
      working-directory: ${{ inputs.working-directory }}/${{ inputs.server-path }}/
      run: |
        if ./gradlew help --task appDistZip -Pversion=${{ inputs.version }} -PgenesisArtifactoryUser="${{ inputs.jfrog-username }}" -PgenesisArtifactoryPassword="${{ inputs.jfrog-password }}" --no-daemon >/dev/null 2>&1; then
          echo "appDistZip=true" >> $GITHUB_OUTPUT
        else
          echo "appDistZip=false" >> $GITHUB_OUTPUT
        fi

    - name: Build the dist
      if: steps.check_task.outputs.appDistZip == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}/${{ inputs.server-path }}/
      run: |
        ./gradlew appDistZip -Pversion=${{ inputs.version }} -PgenesisArtifactoryUser="${{ inputs.jfrog-username }}" -PgenesisArtifactoryPassword="${{ inputs.jfrog-password }}" --no-daemon ${{ inputs.build-server-arguments }}

    - name: Run the JFrog scan
      if: steps.check_task.outputs.appDistZip == 'true'
      id: scan
      shell: bash
      working-directory: ${{ inputs.working-directory }}/${{ inputs.server-path }}/
      run: |
        TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")
        FULL_REPORT="$GITHUB_WORKSPACE/jfrog-scan-full.json"
        TABLE_REPORT="$GITHUB_WORKSPACE/jfrog-scan-table-${TIMESTAMP}.txt"

        jf s --licenses --vuln --format=json */build/dist/*.zip > "$FULL_REPORT"

        if ! jq -r '
          def root:
            if type == "array" then
              (map(select(type == "object"))[0] // {})
            else
              .
            end;

          root as $root
          | (if ($root | type) == "object" then ($root.vulnerabilities // []) else [] end) as $vulns
          | (["CVE", "Severity", "Component", "Fixed Versions"],
             ["---", "---", "---", "---"]),
            ($vulns[]? | [
              .cves[0]?.cve // "N/A",
              .severity // "N/A",
              ((.components | to_entries[0].key) // "N/A"),
              ((.fixed_versions // []) | join(", "))
            ])
          | @tsv
        ' "$FULL_REPORT" > "$TABLE_REPORT"; then
          {
            echo -e "CVE\tSeverity\tComponent\tFixed Versions"
            echo -e "---\t---\t---\t---"
          } > "$TABLE_REPORT"
        fi

        echo "full_report_file=$FULL_REPORT" >> $GITHUB_OUTPUT
        echo "table_report_file=$TABLE_REPORT" >> $GITHUB_OUTPUT

    - name: Create markdown summary
      if: steps.check_task.outputs.appDistZip == 'true'
      uses: genesislcap/appdev-workflows/build-image/json-to-md@develop
      with:
        json_path: ${{ steps.scan.outputs.full_report_file }}

    - name: Upload JFrog full scan report
      if: steps.check_task.outputs.appDistZip == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: xray-full-report--${{ inputs.app-name }}-${{ github.run_number }}
        path: ${{ steps.scan.outputs.full_report_file }}

    - name: Upload JFrog scan table report
      if: steps.check_task.outputs.appDistZip == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: xray-dependencies-scan--${{ inputs.app-name }}-${{ github.run_number }}
        path: ${{ steps.scan.outputs.table_report_file }}
