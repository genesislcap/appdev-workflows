name: Scan with JFrog
description: Scan the distribution for vulnerabilities and licenses

inputs:
  version:
    required: true
  jfrog-username:
    required: true
  jfrog-password:
    required: true
  working-directory:
    default: .
    required: false
  server-path:
    default: server
    required: false

runs:
  using: "composite"
  steps:
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # -----------------------------
    # Install JFrog CLI
    # -----------------------------
    - uses: jfrog/setup-jfrog-cli@v4
      with:
        version: 2.95.0   # updated CLI
      env:
        JF_URL: https://genesisglobal.jfrog.io
        JF_USER: ${{ inputs.jfrog-username }}
        JF_PASSWORD: ${{ inputs.jfrog-password }}

    - name: Check JFrog CLI version
      shell: bash
      run: |
        echo "Installed JFrog CLI version:"
        jf --version

    # -----------------------------
    # Check if appDistZip exists
    # -----------------------------
    - name: Check if appDistZip exists
      shell: bash
      id: check_task
      working-directory: ${{ inputs.working-directory }}/${{ inputs.server-path }}/
      run: |
        if ./gradlew tasks --all -Pversion=${{ inputs.version }} -PgenesisArtifactoryUser="${{ inputs.jfrog-username }}" -PgenesisArtifactoryPassword="${{ inputs.jfrog-password }}" --no-daemon | grep -q "appDistZip"; then
          echo "appDistZip=true" >> $GITHUB_OUTPUT
        else
          echo "appDistZip=false" >> $GITHUB_OUTPUT
        fi

    # -----------------------------
    # Build the distribution
    # -----------------------------
    - name: Build the dist
      if: steps.check_task.outputs.appDistZip == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}/${{ inputs.server-path }}/
      run: |
        ./gradlew appDistZip -Pversion=${{ inputs.version }} -PgenesisArtifactoryUser="${{ inputs.jfrog-username }}" -PgenesisArtifactoryPassword="${{ inputs.jfrog-password }}" --no-daemon

    # -----------------------------
    # Run full JFrog scan (vuln + licenses)
    # -----------------------------
    - name: Run the JFrog scan
      if: steps.check_task.outputs.appDistZip == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}/${{ inputs.server-path }}/
      run: |
        # Xray scan for vulnerabilities and licenses
        jf xr scan --watches "scan" --licenses --vuln */build/dist/*.zip

    # -----------------------------
    # Generate table report (critical/high only, exclude licenses)
    # -----------------------------
    - name: Generate scan table report
      if: steps.check_task.outputs.appDistZip == 'true'
      id: table_report
      shell: bash
      working-directory: ${{ inputs.working-directory }}/${{ inputs.server-path }}/
      run: |
        TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")
        TABLE_REPORT="jfrog-scan-table-${TIMESTAMP}.txt"

        # Xray scan table: Critical/High only, exclude licenses
        jf xr scan --watches "vulnerabilities" --vuln --format=table --min-severity=High */build/dist/*.zip | tee $TABLE_REPORT

        # Move the report to repo root for upload
        mv $TABLE_REPORT $GITHUB_WORKSPACE/

        # Expose the filename
        echo "table_report_file=$GITHUB_WORKSPACE/$TABLE_REPORT" >> $GITHUB_OUTPUT

    - name: Upload JFrog scan table report
      if: steps.check_task.outputs.appDistZip == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: xray-dependencies-scan
        path: ${{ steps.table_report.outputs.table_report_file }}
