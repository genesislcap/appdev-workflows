name: Run Tests
description: Run tests and upload results as GH artifact

inputs:
  version:
    required: true
  jfrog-username:
    required: true
  jfrog-password:
    required: true
  test-reports-suffix:
    required: false
    default: ""
  working-directory:
    default: .
    required: false
  server-path:
    default: server
    required: false
  JENKINSGENESIS_SONAR:
    required: false
  sonar-token:
    required: true

runs:
  using: "composite"
  steps:
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Validate Sonar token
      shell: bash
      run: |
        if [ -z "${{ inputs.sonar-token }}" ]; then
          echo "::error::sonar-token must be provided by the caller environment when sonar is enabled."
          exit 1
        fi

    - name: Set up Java 21 for Sonar
      uses: actions/setup-java@v4
      with:
        java-version: "21"
        distribution: adopt

    - name: Upload test coverage
      shell: bash
      working-directory: ${{ inputs.working-directory }}/${{ inputs.server-path }}/
      run: |
        ./gradlew jacocoTestReport sonarqube -Pversion=${{ inputs.version }} --no-configuration-cache --no-build-cache --stacktrace -PgenesisArtifactoryUser="${{ inputs.jfrog-username }}" -PgenesisArtifactoryPassword="${{ inputs.jfrog-password }}" -Dsonar.token="${{ inputs.sonar-token }}"

    - name: Restore Java 17
      if: always()
      uses: actions/setup-java@v4
      with:
        java-version: "17"
        distribution: adopt

    - name: Upload Test Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-reports${{ inputs.test-reports-suffix }}
        path: "${{ inputs.working-directory }}/${{ inputs.server-path }}/*/build/reports/**/*"

    - name: Publish All Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: |
          ./**/surefire-reports/**/*.xml
          ./**/build/test-results/**/*.xml
        fail_on: nothing
        report_suite_logs: any