name: License Checker
description: Uses ORT to scan the project for the licenses of the dependencies

inputs:
  working-directory:
    required: false
    default: "."
  jfrog-username:
    required: true
  jfrog-password:
    required: true

runs:
  using: "composite"
  steps:
    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Create Gradle cache directory
      shell: bash
      run: |
        mkdir -p ${{ github.workspace }}/.gradle
        mkdir -p ${{ github.workspace }}/server/.gradle

    - name: Run ORT Analyzer
      shell: bash
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/project \
          -v ${{ github.workspace }}/ort-output:/output \
          ghcr.io/oss-review-toolkit/ort-minimal \
          analyze \
          -i /project \
          -o /output

    - name: Run ORT Evaluate Policy
      shell: bash
      run: |
        docker run --rm \
          -v ${{ github.workspace }}/ort-output:/output \
          ghcr.io/oss-review-toolkit/ort-minimal \
          evaluate-policy \
          -i /output/analyzer-result.yml \
          -o /output

    - name: Generate ORT Report
      shell: bash
      run: |
        docker run --rm \
          -v ${{ github.workspace }}/ort-output:/output \
          ghcr.io/oss-review-toolkit/ort-minimal \
          report \
          -i /output/analyzer-result.yml \
          -o /output/report \
          -f StaticHtml

    - name: Upload ORT Report
      uses: actions/upload-artifact@v4
      with:
        name: ort-report
        path: ort-output/report
