name: AWS comamnd to start or stop instances
description: Sends an aws comamnd to get the AWS instances up or down

inputs:
  command:
    required: true
  environment:
    required: true
  aws-access-key-id:
    required: true
  aws-secret-access-key:
    required: true
  aws-region:
    required: true

runs:
  using: "composite"
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}

    - name: Start or Stop instances using the aws cli
      shell: bash
      run: |
        # Variables
        ENVIRONMENT_TAG="${{ inputs.environment }}"
        COMMAND="${{ inputs.command }}"
        COMMAND_LOWER=$(echo "$COMMAND" | tr '[:upper:]' '[:lower:]')

        if [ "$COMMAND_LOWER" != "start" ] && [ "$COMMAND_LOWER" != "stop" ]; then
          echo "Error: only 'start' or 'stop' are accepted as valid commands."
          exit 1
        fi

        # Step 1: Get instance IDs with the specified Environment tag
        INSTANCE_IDS=$(aws ec2 describe-instances \
          --filters "Name=tag:Environment,Values=$ENVIRONMENT_TAG" \
                    "Name=instance-state-name,Values=pending,running,shutting-down,stopping,stopped" \
          --query "Reservations[].Instances[].InstanceId" \
          --output text)

        # Check if instances were found
        if [ -z "$INSTANCE_IDS" ]; then
          echo "No running instances found with the Environment tag value '$ENVIRONMENT_TAG'."
          exit 1
        fi

        echo "Found instances: $INSTANCE_IDS"

        # Step 2: Start or Stop the instances
        if [ "$COMMAND_LOWER" == "start" ]; then
          aws ec2 start-instances --instance-ids $INSTANCE_IDS
          aws ec2 wait instance-status-ok --instance-ids $INSTANCE_IDS
          echo "Command executed successfully. All instances RUNNING"
        elif [ "$COMMAND_LOWER" == "stop" ]; then
          aws ec2 stop-instances --instance-ids $INSTANCE_IDS
          aws ec2 wait instance-stopped --instance-ids $INSTANCE_IDS
          echo "Command executed successfully. All instances STOPPED"
        fi
