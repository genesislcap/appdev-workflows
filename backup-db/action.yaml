name: DB Backup
description: Backup the DB and sync the files to S3

inputs:
  environment:
    required: true
  aws-access-key-id:
    required: true
  aws-secret-access-key:
    required: true
  aws-region:
    required: true
  version:
    required: true
  app_name:
    required: true
  ecr_registry:
    required: true

runs:
  using: "composite"
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}

    - name: Find S3 bucket by tags
      id: find-bucket
      shell: bash
      run: |
        # Find S3 bucket by tags
        ENVIRONMENT="${{ inputs.environment }}"
        APP_NAME="${{ inputs.app_name }}"

        # Fetch resources with the specified tag key and value
        BUCKET_ARN=$(aws resourcegroupstaggingapi get-resources \
          --tag-filters Key=Environment,Values=$ENVIRONMENT Key=AppName,Values=$APP_NAME Key=Type,Values=backups\
          --resource-type-filters s3 \
          --query 'ResourceTagMappingList[0].ResourceARN' \
          --output text)

        if [ "$BUCKET_ARN" == "None" ]; then
          echo "Error: No bucket found with the specified tags."
          exit 1
        fi

        # Extract bucket name from ARN (arn:aws:s3:::bucket-name)
        BUCKET_NAME=$(echo $BUCKET_ARN | cut -d':' -f6)
        echo "Bucket found: $BUCKET_NAME"

        # Set the bucket name as an output
        echo "bucket-name=$BUCKET_NAME" >> $GITHUB_OUTPUT

    - name: Backup DB
      uses: genesislcap/appdev-workflows/ssm-command@develop
      with:
        command:
          source /root/.bashrc &&
          cd /data/docker-compose &&
          mkdir -p /data/dbbackup &&
          chmod 777 /data/dbbackup &&
          docker compose run --rm -v /data/dbbackup:/dbbackup genesis_app bash -c 'source ~/.bashrc; export SCRIPT_MAX_HEAP=-Xmx8g; cd /dbbackup; /app/run/genesis/scripts/unix/python3/JvmRun global.genesis.environment.scripts.DumpTable --all' &&
          tar -czvf /root/db_backup.tar.gz /data/dbbackup/* &&
          aws s3 cp /root/db_backup.tar.gz s3://${{ steps.find-bucket.outputs.bucket-name }} &&
          rm -rf /data/dbbackup &&
          rm -rf root/db_backup.tar.gz
        run_on_all: false
        environment: ${{ inputs.environment }}
        app_name: ${{ inputs.app_name }}
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}
