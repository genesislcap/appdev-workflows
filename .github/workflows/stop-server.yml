       
name: Stop EC2 by Hostname

on:
  workflow_call:     
    inputs:
    
      hostname:
        description: "Private/public hostname or IP of EC2"
        required: true
        type: string

jobs:
  stop-ec2:
    runs-on: [appdev-selfhosted-al2023]
    env:
      SSM_PARAM_NAME: githubrunner-cddev-policy
      REGION: eu-west-2

    steps:
      - name: Install AWS CLI and jq
        run: |
          set -euo pipefail
          sudo dnf install -y awscli jq

      - name: Fetch Role ARN from SSM (use base creds)
        id: fetch-role
        env:
          REGION: ${{ env.REGION }}
          SSM_PARAM_NAME: ${{ env.SSM_PARAM_NAME }}
        run: |
          set -euo pipefail
          echo "Caller before assume:"
          aws sts get-caller-identity --region "$REGION"

          ROLE_ARN=$(aws ssm get-parameter \
            --name "$SSM_PARAM_NAME" \
            --region "$REGION" \
            --with-decryption \
            --query "Parameter.Value" \
            --output text)

          if [ -z "${ROLE_ARN:-}" ] || [ "$ROLE_ARN" = "None" ]; then
            echo "❌ Could not fetch role ARN from SSM parameter: $SSM_PARAM_NAME"
            exit 1
          fi

          echo "role_arn=$ROLE_ARN" >> "$GITHUB_OUTPUT"

      - name: Assume Target Role
        id: assume-role
        env:
          REGION: ${{ env.REGION }}
        run: |
          set -euo pipefail
          unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_PROFILE AWS_DEFAULT_REGION AWS_REGION

          CREDS=$(aws sts assume-role \
            --role-arn "${{ steps.fetch-role.outputs.role_arn }}" \
            --role-session-name githubActionSession \
            --duration-seconds 3600 \
            --region "$REGION")

          echo "AWS_ACCESS_KEY_ID=$(echo "$CREDS" | jq -r '.Credentials.AccessKeyId')" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$(echo "$CREDS" | jq -r '.Credentials.SecretAccessKey')" >> $GITHUB_ENV
          echo "AWS_SESSION_TOKEN=$(echo "$CREDS" | jq -r '.Credentials.SessionToken')" >> $GITHUB_ENV
          echo "AWS_REGION=$REGION" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=$REGION" >> $GITHUB_ENV

          echo "Caller after assume:"
          aws sts get-caller-identity --region "$REGION"

      - name: Resolve Hostname or Use IP
        id: resolve-ip
        run: |
          HOST="${{ inputs.hostname }}"
          if [[ "$HOST" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            IP="$HOST"
          else
            IP=$(getent hosts "$HOST" | awk '{print $1}')
          fi

          if [ -z "$IP" ]; then
            echo "❌ Could not resolve hostname or IP: $HOST"
            exit 1
          fi

          echo "✅ Resolved IP: $IP"
          echo "ip=$IP" >> $GITHUB_OUTPUT

      - name: Lookup EC2 Instance by IP
        id: get-instance
        run: |
          IP=${{ steps.resolve-ip.outputs.ip }}
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=private-ip-address,Values=$IP" \
            --region $REGION \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            INSTANCE_ID=$(aws ec2 describe-instances \
              --filters "Name=public-ip-address,Values=$IP" \
              --region $REGION \
              --query "Reservations[0].Instances[0].InstanceId" \
              --output text)
          fi

          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "❌ No EC2 instance found for IP $IP"
            exit 1
          fi

          echo "✅ EC2 Instance ID: $INSTANCE_ID"
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT

      - name: Stop EC2 Instance
        run: |
          INSTANCE_ID=${{ steps.get-instance.outputs.instance_id }}
          STATE=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --query "Reservations[0].Instances[0].State.Name" \
            --output text)

          echo "ℹ️ Current state of $INSTANCE_ID: $STATE"

          aws ec2 stop-instances --instance-ids "$INSTANCE_ID" --region "$REGION"

          echo "✅ Stop command issued for instance $INSTANCE_ID"
