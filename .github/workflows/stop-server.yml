name: Stop EC2 by Hostname (simple)

on:
  workflow_call:
    inputs:
      hostname:
        description: "Private/public hostname or IP of EC2"
        required: true
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_SESSION_TOKEN:    # optional, only if using temporary creds
        required: false

jobs:
  stop-ec2:
    runs-on: [appdev-selfhosted-al2023]
    env:
      REGION: eu-west-2

    steps:
      - name: Configure AWS credentials (from secrets)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.REGION }}
          # Pass session token only if you actually set it as a secret (temp creds)
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Show caller (sanity check)
        run: aws sts get-caller-identity

      - name: Resolve Hostname or Use IP
        id: resolve-ip
        shell: bash
        run: |
          set -euo pipefail
          HOST="${{ inputs.hostname }}"

          # If already IPv4, use as-is. Otherwise resolve first IPv4.
          if [[ "$HOST" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            IP="$HOST"
          else
            if getent ahostsv4 "$HOST" >/dev/null 2>&1; then
              IP=$(getent ahostsv4 "$HOST" | awk 'NR==1{print $1}')
            else
              IP=$(getent hosts "$HOST" | awk '/^[0-9]+\./{print $1; exit}')
            fi
          fi

          if [ -z "${IP:-}" ]; then
            echo "Could not resolve hostname or IP: $HOST" >&2
            exit 1
          fi

          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          echo "Resolved IP: $IP"

      - name: Lookup EC2 Instance by IP
        id: get-instance
        env:
          REGION: ${{ env.REGION }}
        shell: bash
        run: |
          set -euo pipefail
          IP=${{ steps.resolve-ip.outputs.ip }}

          # Try private IP first, then public (filter is ip-address for public)
          IDS_PRIVATE=$(aws ec2 describe-instances \
            --filters "Name=private-ip-address,Values=$IP" \
            --region "$REGION" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text)

          IDS_PUBLIC=$(aws ec2 describe-instances \
            --filters "Name=ip-address,Values=$IP" \
            --region "$REGION" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text)

          INSTANCE_IDS="$(echo "$IDS_PRIVATE $IDS_PUBLIC" | xargs)"
          if [ -z "$INSTANCE_IDS" ]; then
            echo "No EC2 instance found for IP $IP in $REGION" >&2
            exit 1
          fi

          INSTANCE_ID=$(echo "$INSTANCE_IDS" | awk '{print $1}')
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "Found instance: $INSTANCE_ID"

      - name: Stop EC2 instance (and wait for stopped)
        env:
          REGION: ${{ env.REGION }}
        shell: bash
        run: |
          set -euo pipefail
          INSTANCE_ID=${{ steps.get-instance.outputs.instance_id }}

          STATE=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --query "Reservations[].Instances[].State.Name" \
            --output text)
          echo "Current state: $STATE"

          if [ "$STATE" != "stopped" ]; then
            aws ec2 stop-instances --instance-ids "$INSTANCE_ID" --region "$REGION" >/dev/null
            echo "Waiting for 'stopped'..."
            aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID" --region "$REGION"
          fi

          FINAL=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --query "Reservations[].Instances[].State.Name" \
            --output text)
          echo "Final state: $FINAL"
