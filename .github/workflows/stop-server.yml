name: Stop EC2 by Hostname

on:
  workflow_call:     
    inputs:
      hostname:
        required: true
        type: string
        description: "Private hostname of EC2 "   
      
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true        
      AWS_SECRET_ACCESS_KEY:
        required: true
        
        

jobs:
  stop-ec2:
    runs-on: [ appdev-selfhosted-al2023 ]

    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:        
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-west-2

    - name: Find and stop EC2 instance by Name tag
      run: |
        HOSTNAME="${{ github.event.inputs.hostname }}"
    
        echo "Looking up EC2 instance with Name tag: $HOSTNAME"
    
        INSTANCE_ID=$(aws ec2 describe-instances \
          --filters "Name=tag:Name,Values=$HOSTNAME" \
          --query "Reservations[].Instances[].InstanceId" \
          --output text)
    
        if [ -z "$INSTANCE_ID" ]; then
          echo "❌ No EC2 instance found for Name tag: $HOSTNAME"
          exit 1
        fi
    
        echo "✅ Found EC2 instance ID: $INSTANCE_ID"
        aws ec2 stop-instances --instance-ids "$INSTANCE_ID"