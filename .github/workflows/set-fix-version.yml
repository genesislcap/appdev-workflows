name: Jira Fix Version Automation

on:
  workflow_call:
    inputs:
      prev_tag:
        description: 'Previous release tag'
        required: true
        type: string
      cur_tag:
        description: 'Current release tag'
        required: true
        type: string
      dry_run:
        description: 'Dry run mode (yes/no)'  # If set to 'yes', no changes are made to Jira
        required: true
        type: string

    secrets:
      JIRA_URL:
        required: true
      JIRA_TOKEN:
        required: true
      JIRA_USER:
        required: true

jobs:
  jira-fixversion:
    runs-on: ubuntu-latest

    env:
      GITHUB_REPO: ${{ github.repository }}  # The repository this workflow is running in
      GITHUB_REF: ${{ github.ref }}  # The Git reference that triggered the workflow
      GITHUB_RUN_NUMBER: ${{ github.run_number }}  # Unique run number for this workflow

    steps:
      # Checkout the repository to get all tags and commits for the workflow
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Ensure that all commits and tags are fetched

      # Set up Python for the job
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      # Install dependencies required for the script
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests jira pandas

      # Log input parameters to verify values
      - name: Log input parameters
        run: |
          echo "Previous Tag: ${{ inputs.prev_tag }}"
          echo "Current Tag: ${{ inputs.cur_tag }}"
          echo "Dry Run: ${{ inputs.dry_run }}"

      # Extract Jira issue keys from commit messages between the previous and current tags
      - name: Extract Jira issues from commits
        id: extract_jiras
        run: |
          set -x  # Enable command tracing for debugging
          set -e  # Exit on error to ensure we catch any failure

          # Get the previous and current tags
          PREV_TAG="${{ inputs.prev_tag }}"
          CUR_TAG="${{ inputs.cur_tag }}"
          DRY_RUN="${{ inputs.dry_run }}"

          # Sanitize the tags to avoid invalid characters in file names
          SANITIZED_CUR_TAG=$(echo "$CUR_TAG" | tr '/.' '_')
          SANITIZED_PREV_TAG=$(echo "$PREV_TAG" | tr '/.' '_')

          # Define the CSV file path
          CSV_FILE="${GITHUB_WORKSPACE}/tag_${SANITIZED_CUR_TAG}-${SANITIZED_PREV_TAG}-jira-${GITHUB_RUN_NUMBER}.csv"

          # Debugging: Log the file path
          echo "The CSV file will be created at: $CSV_FILE"

          # Ensure the directory exists
          mkdir -p "$(dirname "$CSV_FILE")"

          # Create the CSV file and write headers
          echo "Creating CSV file at: $CSV_FILE"
          echo "JiraID,Project,Summary,Status,FixVersions" > "$CSV_FILE"

          # Start processing commits
          echo "Starting Git fetch to collect commits between tags $PREV_TAG and $CUR_TAG"
          git fetch --tags
          COMMITS=$(git log $PREV_TAG..$CUR_TAG --pretty=format:"%H %s")

          # Log the collected commits
          echo "Collected commits between $PREV_TAG and $CUR_TAG:"
          echo "$COMMITS"

          # Extract Jira issue keys from commits
          for COMMIT in $COMMITS; do
              echo "Processing commit: $COMMIT"  # Debugging: Show the commit being processed
              JIRAS=$(echo "$COMMIT" | grep -oE '[A-Z]+-[0-9]+')  # Improved regex

              # Debugging: Show extracted Jira IDs
              if [ -z "$JIRAS" ]; then
                  echo "No Jira ID found in commit: $COMMIT"
              else
                  echo "Found Jira IDs: $JIRAS"
              fi

              for J in $JIRAS; do
                  echo "Found Jira ID: $J"
                  echo "$J,,,, " >> "$CSV_FILE"
              done
          done

          # Debugging: Check if the CSV file has been updated after processing commits
          if [ -f "$CSV_FILE" ]; then
              echo "CSV file content after commit processing:"
              cat "$CSV_FILE"
          else
              echo "CSV file still not created after processing commits!"
          fi

          echo "CSV file generated: $CSV_FILE"
          echo "csv_file=$CSV_FILE" >> $GITHUB_OUTPUT
          echo "dry_run=$DRY_RUN" >> $GITHUB_OUTPUT

      # Set Fix Version for Jira issues by updating the issues in Jira
      - name: Set Fix Version on Jira issues
        run: |
          echo "Running Python script to set fix version"
          python scripts/set_fix_version.py  # Adjust the path if you put the Python file elsewhere
        env:
          JIRA_URL: ${{ secrets.JIRA_URL }}   # Pass secrets as environment variables
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          JIRA_USER: ${{ secrets.JIRA_USER }}
          CUR_TAG: ${{ inputs.cur_tag }}
          CSV_FILE: ${{ steps.extract_jiras.outputs.csv_file }}
          DRY_RUN: ${{ steps.extract_jiras.outputs.dry_run }}

      # Upload the generated CSV file as an artifact
      - name: Upload Jira CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: tag_${{ inputs.cur_tag }}-${{ inputs.prev_tag }}-jira-${{ github.run_number }}
          path: ${{ steps.extract_jiras.outputs.csv_file }}
