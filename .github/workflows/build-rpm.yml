# This is a workflow calling the steps-jobs from appdev-devops repo which has the main file
name: Build RPM

on:
  workflow_call:
    outputs:
      rpm_name:
        description: "The first output string"
        value: ${{ jobs.build.outputs.rpm_name }}
    inputs:
      product_name:
        required: true
        type: string
      version:
        required: true
        type: string
      artifactory_deploy_locations:
        required: true
        type: string
        description: Comma separated list of folders in Artifactory to deploy the RPM
      server-distribution:
        required: false
        type: string
        description: Server tar file (required when build_server is true)
      client-distribution:
        required: true
        type: string
        description: Client tar file
      site-distribution:
        required: false
        type: string
        description: Optional site-specific override
      genesis-user:
        required: true
        type: string
        description: User to login as when installed
      spec-file-branch:
        required: false
        type: string
        description: Branch to get the spec file from
      nginx-conf:
        required: false
        type: string
        description: Optional nginx override
      build_server:
        description: "Whether to build and upload the server component"
        required: false
        default: true
        type: boolean
      include-xray-report:
        required: false
        type: boolean
        default: false
        description: Include JFrog Xray report in the packaged distribution

    secrets:
      JFROG_USERNAME:
        required: true
      JFROG_PASSWORD:
        required: true
      SLACK_WEBHOOK:
        required: false

env:
  JFROG_USERNAME: ${{ secrets.JFROG_USERNAME }}
  JFROG_PASSWORD: ${{ secrets.JFROG_PASSWORD }}

# A workflow run is called from the devops appdev-workflow repos
jobs:
  build:
    runs-on: appdev-selfhosted-al2023
    outputs:
      rpm_name: ${{ steps.upload-rpm.outputs.uploaded_rpm_name }}
    steps:
      - name: Grab spec file
        uses: actions/checkout@v3
        with:
          repository: genesislcap/appdev-workflows
          fetch-depth: 2
          ref: ${{ inputs.spec-file-branch }}

      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          path: base-repo

      - name: Setup
        working-directory: rpm
        run: |
          rm -rf ~/rpmbuild/*
          sudo yum -y install rpm
          sudo yum -y install rpm-build
          sudo yum -y install wget
          mkdir downloads
          mkdir web-downloads

      - name: Validate inputs
        run: |
          # Validate that server-distribution is provided when build_server is true
          if [ "${{ inputs.build_server }}" == "true" ]; then
            if [ -z "${{ inputs.server-distribution }}" ]; then
              echo "❌ Error: server-distribution is required when build_server is true"
              exit 1
            fi
          fi
          echo "✅ Input validation passed"

      - name: Downloads
        if: ${{ inputs.build_server }}
        working-directory: rpm/downloads
        run: |
          wget --user=${{ secrets.JFROG_USERNAME }} --password="${{secrets.JFROG_PASSWORD}}" https://genesisglobal.jfrog.io/artifactory/${{ inputs.server-distribution }}

      - name: Optional site download
        if: inputs.site-distribution
        working-directory: rpm/downloads
        run: |
          wget --user=${{ secrets.JFROG_USERNAME }} --password="${{secrets.JFROG_PASSWORD}}" https://genesisglobal.jfrog.io/artifactory/${{ inputs.site-distribution }}

      - name: Server Package
        if: ${{ inputs.build_server }}
        working-directory: rpm/downloads
        run: |
          VERSION=$(echo "${{ inputs.version }}" | tr '-' '_')
          ls -al
          tar xf genesis_*.tar.gz
          rm genesis_*.tar.gz
          if ls *site-specific*.zip 1> /dev/null 2>&1; then
            echo "Detected site-specific override, using that one"
            rm -rf site-specific
            echo A | unzip -q *-site-specific-*.zip
            echo "Removing zip files"
            rm *.zip
          fi
          echo "Zipping package"
          tar cf server-$VERSION.tar.gz *
          ls -al
          echo "Unzipping tar as a test"
          tar xf server-$VERSION.tar.gz
          mv *.tar.gz ../
          ls -al

      - name: Web Download and Package
        working-directory: rpm/web-downloads
        run: |
          VERSION=$(echo "${{ inputs.version }}" | tr '-' '_')
          wget --user=${{ secrets.JFROG_USERNAME }} --password="${{secrets.JFROG_PASSWORD}}" https://genesisglobal.jfrog.io/artifactory/${{ inputs.client-distribution }}
          unzip -q *web*.zip
          rm *.zip
          ls -al
          if [ -n "${{ inputs.nginx-conf }}" ]; then
            cp "${GITHUB_WORKSPACE}/base-repo/${{ inputs.nginx-conf }}" ./nginx.conf
          fi
          echo "Zipping package"
          tar cf web-$VERSION.tar.gz *
          ls -al
          echo "Unzipping tar as a test"
          tar xf web-$VERSION.tar.gz
          mv *.tar.gz ../
          
      - name: Download summary JFrog scan report
        if: inputs.include-xray-report
        uses: actions/download-artifact@v4
        with:
          pattern: xray-dependencies-scan--*-${{ github.run_number }}
          path: rpm/extra-report
          merge-multiple: true

      - name: Copy summary scan report into package
        if: inputs.include-xray-report
        shell: bash
        run: |
          mkdir -p rpm/extra-content
          REPORT_FILE=$(find rpm/extra-report -type f -name '*.txt' | head -n 1)

          if [ -z "$REPORT_FILE" ]; then
            echo "No JFrog scan report txt file found"
            find rpm/extra-report -maxdepth 5 -type f || true
            exit 1
          fi

          cp "$REPORT_FILE" rpm/extra-content/jfrog-scan-table.txt
          ls -al rpm/extra-content

      - name: Download full JFrog scan report
        if: inputs.include-xray-report
        uses: actions/download-artifact@v4
        with:
          pattern: xray-full-report--*-${{ github.run_number }}
          path: rpm/full-report
          merge-multiple: true

      - name: Copy full scan report into package
        if: inputs.include-xray-report
        shell: bash
        run: |
          mkdir -p rpm/extra-content
          REPORT_FILE=$(find rpm/full-report -type f -name '*.json' | head -n 1)

          if [ -z "$REPORT_FILE" ]; then
            echo "No full JFrog scan json file found"
            find rpm/full-report -maxdepth 5 -type f || true
            exit 1
          fi

          cp "$REPORT_FILE" rpm/extra-content/jfrog-scan-full.json
          ls -al rpm/extra-content
          
      - name: Debug report staging
        if: inputs.include-xray-report
        run: |
          echo "=== extra-report ==="
          find rpm/extra-report -maxdepth 5 -type f | sort || true
          echo "=== extra-content ==="
          find rpm/extra-content -maxdepth 5 -type f | sort || true
      
      - name: Build RPM
        working-directory: rpm
        run: |
          VERSION=$(echo "${{ inputs.version }}" | tr '-' '_')
          ls -al
          rm -rf web-downloads downloads
          sed -i "s/1.0.0/$VERSION/g" product.spec
          sed -i "s/PRODUCT/${{ inputs.product_name }}/g" product.spec
          sed -i "s/genesisUser/$(echo ${{ inputs.genesis-user }})/g" product.spec
          mkdir -p ~/rpmbuild/SOURCES/
          mv *.gz ~/rpmbuild/SOURCES/

          if [ "${{ inputs.include-xray-report }}" == "true" ] && [ -d extra-content ]; then
            cp extra-content/* ~/rpmbuild/SOURCES/
          fi

          mv product.spec ~/rpmbuild/SOURCES/
          cd ~/rpmbuild/SOURCES/

          if [ "${{ inputs.build_server }}" == "false" ]; then
            if [ "${{ inputs.include-xray-report }}" == "true" ]; then
              rpmbuild -bb --define "web_only 1" --define "include_xray_report 1" product.spec
            else
              rpmbuild -bb --define "web_only 1" product.spec
            fi
          else
            if [ "${{ inputs.include-xray-report }}" == "true" ]; then
              rpmbuild -bb --define "include_xray_report 1" product.spec
            else
              rpmbuild -bb product.spec
            fi
          fi

      - name: Upload RPMs to S3
        run: |
          echo "Clear AWS credentials inherited from the environment"
          unset AWS_ACCESS_KEY_ID
          unset AWS_SECRET_ACCESS_KEY
          unset AWS_SESSION_TOKEN
          unset AWS_PROFILE
          unset AWS_DEFAULT_PROFILE
          echo "Delete any credential/config files"
          rm -f ~/.aws/credentials ~/.aws/config

          cd ~/rpmbuild/SRPMS/
          ls -al
          IFS=',' read -ra locations <<< "${{ inputs.artifactory_deploy_locations }}"
          for location in "${locations[@]}"; do
              aws s3 sync ~/rpmbuild/RPMS/noarch/ s3://product-rpms/"$location"
          done

      - name: GET  RPM NAME
        id: upload-rpm
        run: |
          echo "Clear AWS credentials inherited from the environment"
          unset AWS_ACCESS_KEY_ID
          unset AWS_SECRET_ACCESS_KEY
          unset AWS_SESSION_TOKEN
          unset AWS_PROFILE
          unset AWS_DEFAULT_PROFILE
          echo "Delete any credential/config files"
          rm -f ~/.aws/credentials ~/.aws/config

          echo "Uploading files to s3 now...."
          cd ~/rpmbuild/RPMS/noarch/
          ls -al
          uploaded_rpm_name=$(ls -1 *.rpm)
          echo "uploaded_rpm_name=$uploaded_rpm_name" >> $GITHUB_OUTPUT

      - name: Notify failure on Slack
        uses: youscan/gitactions-slack-notification@3.0.0
        if: failure() && env.SLACK_INCOMING_WEBHOOK
        env:
          SLACK_INCOMING_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_TITLE: ❌ RPM build for ${{ inputs.product_name }} failed
          SLACK_MESSAGE: The RPM build for ${{ github.workflow }} failed https://github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}/actions/runs/${{ github.run_id }}
          SLACK_CHANNEL: ${{ inputs.product_name }}-build-notifications

      - name: Notify success on Slack
        uses: youscan/gitactions-slack-notification@3.0.0
        if: success() && env.SLACK_INCOMING_WEBHOOK
        env:
          SLACK_INCOMING_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_TITLE: ✅ RPM build for ${{ inputs.product_name }} passed
          SLACK_MESSAGE: The RPM build for ${{ github.workflow }} passed https://github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}/actions/runs/${{ github.run_id }}
          SLACK_CHANNEL: ${{ inputs.product_name }}-build-notifications
