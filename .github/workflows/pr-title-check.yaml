name: PR - Title check

on:
  workflow_call:

jobs:
  main:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        with:
          subjectPattern: .*\([A-Z]+-\d+\)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
