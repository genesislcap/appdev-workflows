      # - name: Verify upload succeeded
      #   shell: bash
      #   run: |
      #     # Use ZIP filename if conversion was done, otherwise use original RPM name
      #     if [ "${{ inputs.rpm-to-zip }}" == "true" ]; then
      #       UPLOAD_FILENAME="${{ steps.convert-rpm.outputs.zip-filename }}"
      #     else
      #       UPLOAD_FILENAME="${{ inputs.package_name }}"
      #     fi
          
      #     JFROG_URL="https://genesisglobal.jfrog.io/artifactory/${{ inputs.jfrog-repo }}/$UPLOAD_FILENAME"
