      - name: Cleanup temporary files
        if: always()
        shell: bash
        run: |
          TEMP_DIR="${{ steps.download-package.outputs.temp-dir }}"
          if [ -n "$TEMP_DIR" ] && [ -d "$TEMP_DIR" ]; then
            echo "Cleaning up temporary directory: $TEMP_DIR"
            rm -rf "$TEMP_DIR"
            echo "Cleanup completed"
          fi
