name: Deploy package

on:
  workflow_call:
    inputs:
      branch:
        required: false
        type: string
      client:
        required: true
        type: string
      environment:
        required: true
        type: string
      hosts:
        required: false
        type: string
        default: "ALL"
      db_backup:
        required: false
        type: boolean
      run_clear_codegen_cache:
        required: false
        type: boolean
      run_genesis_install:
        required: false
        type: boolean
      run_install_hooks:
        required: false
        type: boolean
      run_remap:
        required: false
        type: boolean
      start_server:
        required: false
        type: boolean
      genesis_user:
        required: false
        type: string
      environment_level:
        required: false
        type: string
      product:
        required: false
        type: string
      package_version:
        required: false
        type: string
      repotype:
        required: false
        type: string
      testautomation_build:
        required: false
        default: false
        type: boolean
      deploy_custom_nginx:
        required: false
        default: false
        type: boolean

    secrets:
      JENKINS_SECURITYTOKEN:
        required: true
      JENKINS_TOKEN:
        required: false

jobs:
  build:
    name: Steps to Deploy package
    runs-on: appdev-small
    environment: master

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: '0'
          ref: ${{ inputs.branch }}

      - name: Install jq
        run: sudo dnf install -y jq

      - name: Trigger Jenkins Job and Get Queue ID
        run: |
          JENKINS_URL="https://jenkinsdev.cdservice.genesis.global"
          JOB_PATH="job/AppDev-CI_CD/job/${{ inputs.product }}/job/${{ inputs.environment_level }}/job/product_${{ inputs.product }}_upgrade"

          JOB_TRIGGER_URL="$JENKINS_URL/$JOB_PATH/buildWithParameters?token=${{ secrets.JENKINS_SECURITYTOKEN }}"

          # Trigger Jenkins Job
          RESPONSE=$(curl -X POST "$JOB_TRIGGER_URL" \
            --data-urlencode "client=${{ inputs.client }}" \
            --data-urlencode "environment=${{ inputs.environment }}" \
            --data-urlencode "hosts=${{ inputs.hosts }}" \
            --data-urlencode "package_version=${{ inputs.package_version }}" \
            --data-urlencode "db_backup=${{ inputs.db_backup }}" \
            --data-urlencode "run_clear_codegen_cache=${{ inputs.run_clear_codegen_cache }}" \
            --data-urlencode "run_genesis_install=${{ inputs.run_genesis_install }}" \
            --data-urlencode "run_install_hooks=${{ inputs.run_install_hooks }}" \
            --data-urlencode "run_remap=${{ inputs.run_remap }}" \
            --data-urlencode "start_server=${{ inputs.start_server }}" \
            --data-urlencode "genesis_user=${{ inputs.genesis_user }}" \
            --data-urlencode "environment_level=${{ inputs.environment_level }}" \
            --data-urlencode "product=${{ inputs.product }}" \
            --data-urlencode "repotype=${{ inputs.repotype }}" \
            --data-urlencode "deploy_custom_nginx=${{ inputs.deploy_custom_nginx }}" \
            -i)

          echo "Jenkins API Trigger Response:"
          echo "$RESPONSE"

          # Fetch the latest queue item
          QUEUE_URL="$JENKINS_URL/queue/api/json"
          QUEUE_RESPONSE=$(curl -s "$QUEUE_URL")

          echo "Jenkins Queue API Response:"
          echo "$QUEUE_RESPONSE"

          QUEUE_ID=$(echo "$QUEUE_RESPONSE" | jq -r '.items[-1].id')

          if [[ -z "$QUEUE_ID" || "$QUEUE_ID" == "null" ]]; then
            echo "Error: Could not retrieve Jenkins Queue ID."
            exit 1
          fi

          echo "Jenkins Job added to Queue with ID: $QUEUE_ID"

          echo "QUEUE_ID=$QUEUE_ID" >> $GITHUB_ENV

      - name: Poll Jenkins for Job Status
        run: |
          JENKINS_URL="https://jenkinsdev.cdservice.genesis.global"
          JOB_PATH="job/AppDev-CI_CD/job/${{ inputs.product }}/job/${{ inputs.environment_level }}/job/product_${{ inputs.product }}_upgrade"

          MAX_ATTEMPTS=30
          ATTEMPTS=0
          BUILD_NUMBER=""

          echo "Waiting for Jenkins Job to start..."
          while [ -z "$BUILD_NUMBER" ] && [ $ATTEMPTS -lt $MAX_ATTEMPTS ]; do
            JOB_INFO=$(curl -s "$JENKINS_URL/$JOB_PATH/api/json")
            BUILD_NUMBER=$(echo "$JOB_INFO" | jq -r '.lastBuild.number')

            if [ "$BUILD_NUMBER" != "null" ] && [ -n "$BUILD_NUMBER" ]; then
              echo "Jenkins Job Started with Build Number: $BUILD_NUMBER"
              echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
              break
            fi

            echo "Waiting for job to start..."
            sleep 10
            ((ATTEMPTS++))
          done

          if [ -z "$BUILD_NUMBER" ]; then
            echo "Error: Jenkins job did not start in time."
            exit 2
          fi

          # Poll for Job Completion
          JOB_STATUS=""
          ATTEMPTS=0
          while [ -z "$JOB_STATUS" ] || [ "$JOB_STATUS" == "null" ]; do
            JOB_RESPONSE=$(curl -s "$JENKINS_URL/$JOB_PATH/$BUILD_NUMBER/api/json")
            JOB_STATUS=$(echo "$JOB_RESPONSE" | jq -r .result)

            echo "Current status: $JOB_STATUS"

            if [ "$JOB_STATUS" == "SUCCESS" ]; then
              echo "Jenkins job completed successfully."
              exit 0
            elif [ "$JOB_STATUS" == "FAILURE" ]; then
              echo "Jenkins job failed."
              exit 1
            elif [ "$JOB_STATUS" == "ABORTED" ]; then
              echo "Jenkins job was aborted."
              exit 2
            fi

            echo "Job is still running..."
            sleep 10
            ((ATTEMPTS++))

            if [ $ATTEMPTS -ge $MAX_ATTEMPTS ]; then
              echo "Error: Jenkins job polling timed out."
              exit 3
            fi
          done
