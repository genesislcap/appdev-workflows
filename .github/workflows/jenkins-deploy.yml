name: Deploy package

on:
  workflow_call:
    inputs:
      branch:
        required: false
        type: string
      client:
        required: true
        type: string
      environment:
        required: true
        type: string
      hosts:
        required: false
        type: string
        default: "ALL"
      db_backup:
        required: false
        type: boolean
      run_clear_codegen_cache:
        required: false
        type: boolean
      run_genesis_install:
        required: false
        type: boolean
      run_install_hooks:
        required: false
        type: boolean
      run_remap:
        required: false
        type: boolean
      start_server:
        required: false
        type: boolean
      genesis_user:
        required: false
        type: string
      environment_level:
        required: false
        type: string
      product:
        required: false
        type: string
      package_version:
        required: false
        type: string
      repotype:
        required: false
        type: string
      testautomation_build:
        required: false
        default: false
        type: boolean
      deploy_custom_nginx:
        required: false
        default: false
        type: boolean

    secrets:
      JENKINS_SECURITYTOKEN:
        required: true
      JENKINS_TOKEN:
        required: false

jobs:
  build:
    name: Steps to Deploy package
    runs-on: appdev-small
    environment: master

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: '0'
          ref: ${{ inputs.branch }}

      - name: Trigger Jenkins Job & Poll Status
        run: |
          JOB_NAME="AppDev-CI_CD/${{ inputs.product }}/${{ inputs.environment_level }}/product_${{ inputs.product }}_upgrade"
          JENKINS_URL="https://jenkinsdev.cdservice.genesis.global"
          JOB_TRIGGER_URL="$JENKINS_URL/job/$JOB_NAME/buildWithParameters"
          JENKINS_QUEUE_URL="$JENKINS_URL/queue/item"

          # Trigger Jenkins Job & Capture Queue ID
          echo "Triggering Jenkins job..."
          RESPONSE=$(curl -X POST "$JOB_TRIGGER_URL" \
            --data-urlencode "token=${{ secrets.JENKINS_SECURITYTOKEN }}" \
            --data-urlencode "client=${{ inputs.client }}" \
            --data-urlencode "environment=${{ inputs.environment }}" \
            --data-urlencode "hosts=${{ inputs.hosts }}" \
            --data-urlencode "package_version=${{ inputs.package_version }}" \
            --data-urlencode "db_backup=${{ inputs.db_backup }}" \
            --data-urlencode "run_clear_codegen_cache=${{ inputs.run_clear_codegen_cache }}" \
            --data-urlencode "run_genesis_install=${{ inputs.run_genesis_install }}" \
            --data-urlencode "run_install_hooks=${{ inputs.run_install_hooks }}" \
            --data-urlencode "run_remap=${{ inputs.run_remap }}" \
            --data-urlencode "start_server=${{ inputs.start_server }}" \
            --data-urlencode "genesis_user=${{ inputs.genesis_user }}" \
            --data-urlencode "environment_level=${{ inputs.environment_level }}" \
            --data-urlencode "product=${{ inputs.product }}" \
            --data-urlencode "repotype=${{ inputs.repotype }}" \
            --data-urlencode "deploy_custom_nginx=${{ inputs.deploy_custom_nginx }}" \
            -i | grep -Fi Location | awk '{print $2}' | tr -d '\r\n')

          QUEUE_ID=$(echo "$RESPONSE" | sed 's|.*/queue/item/||')

          if [[ -z "$QUEUE_ID" ]]; then
            echo "Error: Could not retrieve Jenkins Queue ID."
            exit 1
          fi

          echo "Jenkins Job added to Queue with ID: $QUEUE_ID"

          # Wait for Job to Start & Get Build Number
          echo "Waiting for build to start..."
          BUILD_NUMBER=""
          ATTEMPTS=0
          MAX_ATTEMPTS=30
          while [ -z "$BUILD_NUMBER" ] && [ $ATTEMPTS -lt $MAX_ATTEMPTS ]; do
            sleep 5
            RESPONSE=$(curl -s "$JENKINS_QUEUE_URL/$QUEUE_ID/api/json")
            if echo "$RESPONSE" | jq -e '.executable.number' > /dev/null; then
              BUILD_NUMBER=$(echo "$RESPONSE" | jq -r '.executable.number')
            fi
            ((ATTEMPTS++))
          done

          if [[ -z "$BUILD_NUMBER" ]]; then
            echo "Error: Could not retrieve Jenkins Build Number."
            exit 2
          fi

          echo "Jenkins Job Started with Build Number: $BUILD_NUMBER"

          # Poll Build Status
          JOB_STATUS_URL="$JENKINS_URL/job/$JOB_NAME/$BUILD_NUMBER/api/json"
          echo "Polling Jenkins Build Status..."

          ATTEMPTS=0
          while [ $ATTEMPTS -lt $MAX_ATTEMPTS ]; do
            sleep 10
            RESPONSE=$(curl -s "$JOB_STATUS_URL")

            # Debugging: Print response
            echo "Jenkins API Response: $RESPONSE"

            if echo "$RESPONSE" | grep -q "Unauthorized"; then
              echo "Error: Jenkins authentication failed."
              exit 5
            fi

            if echo "$RESPONSE" | jq empty 2>/dev/null; then
              JOB_STATUS=$(echo "$RESPONSE" | jq -r .result)
            else
              echo "Error: Invalid JSON response from Jenkins API."
              exit 4
            fi

            echo "Current status: $JOB_STATUS"

            if [ "$JOB_STATUS" == "SUCCESS" ]; then
              echo "Jenkins job completed successfully."
              exit 0
            elif [ "$JOB_STATUS" == "FAILURE" ]; then
              echo "Jenkins job failed."
              exit 1
            elif [ "$JOB_STATUS" == "ABORTED" ]; then
              echo "Jenkins job was aborted."
              exit 2
            fi

            ((ATTEMPTS++))
          done

          echo "Jenkins job polling timed out."
          exit 3
