name:  Deploy package

on:
  workflow_call:
    inputs:
      branch:
        required: false
        type: string
      client:
        required: true
        type: string
      environment:
        required: true
        type: string
      hosts:
        required: false
        type: string
        default: "ALL"

      db_backup:
        required: false
        type: boolean

      run_clear_codegen_cache:
        required: false
        type: boolean

      run_genesis_install:
        required: false
        type: boolean

      run_install_hooks:
        required: false
        type: boolean

      run_remap:
        required: false
        type: boolean

      start_server:
        required: false
        type: boolean

      run_post_install_hooks:
        required: false
        type: boolean

      genesis_user:
        required: false
        type: string

      environment_level:
        required: false
        type: string

      product:
        required: false
        type: string

      package_version:
        required: false
        type: string

      repotype:
        required: false
        type: string

      testautomation_build:
        required: false
        default: false
        type: boolean
      deploy_custom_nginx:
        required: false
        default: false
        type: boolean

    secrets:
      JENKINS_SECURITYTOKEN:
        required: true
      JENKINS_TOKEN:
        required: false
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    name: Steps to Deploy package
    runs-on: appdev-selfhosted-al2023
    environment: master

    steps:

      - uses: actions/checkout@v3
        with:
          fetch-depth: '0'
          ref: ${{ inputs.branch }}

      - name: Trigger Jenkins Job
        id: trigger_jenkins_job
        run: |
          set -euo pipefail
          RESPONSE_HEADERS=$(mktemp)

          curl --fail --silent --show-error -D "$RESPONSE_HEADERS" -X POST "https://jenkinsdev.cdservice.genesis.global/buildByToken/buildWithParameters?token=${{ secrets.JENKINS_SECURITYTOKEN }}&job=AppDev-CI_CD/${{ inputs.product }}/${{ inputs.environment_level }}/product_${{ inputs.product }}_upgrade" \
            --data-urlencode "client=${{ inputs.client }}" \
            --data-urlencode "environment=${{ inputs.environment }}" \
            --data-urlencode "hosts=${{ inputs.hosts }}" \
            --data-urlencode "package_version=${{ inputs.package_version }}" \
            --data-urlencode "db_backup=${{ inputs.db_backup }}" \
            --data-urlencode "run_clear_codegen_cache=${{ inputs.run_clear_codegen_cache }}" \
            --data-urlencode "run_genesis_install=${{ inputs.run_genesis_install }}" \
            --data-urlencode "run_install_hooks=${{ inputs.run_install_hooks }}" \
            --data-urlencode "run_remap=${{ inputs.run_remap }}" \
            --data-urlencode "start_server=${{ inputs.start_server }}" \
            --data-urlencode "genesis_user=${{ inputs.genesis_user }}" \
            --data-urlencode "environment_level=${{ inputs.environment_level }}" \
            --data-urlencode "product=${{ inputs.product }}" \
            --data-urlencode "repotype=${{ inputs.repotype }}" \
            --data-urlencode "deploy_custom_nginx=${{ inputs.deploy_custom_nginx }}" \
            --data-urlencode "run_post_install_hooks=${{ inputs.run_post_install_hooks }}"

          QUEUE_URL=$(awk 'BEGIN { IGNORECASE = 1 } /^Location:/ { print $2 }' "$RESPONSE_HEADERS" | tr -d '\r')
          rm -f "$RESPONSE_HEADERS"

          if [ -z "$QUEUE_URL" ]; then
            echo "Failed to capture Jenkins queue URL from trigger response."
            exit 1
          fi

          echo "queue_url=$QUEUE_URL" >> "$GITHUB_OUTPUT"

      - name: Install jq
        if: ${{ inputs.testautomation_build }}
        run: sudo dnf install -y jq

      - name: Poll Jenkins for Job Status
        if: ${{ inputs.testautomation_build }}
        run: |
          set -euo pipefail

          if [ -z "${{ secrets.JENKINS_TOKEN }}" ]; then
            echo "JENKINS_TOKEN is required when testautomation_build is true."
            exit 1
          fi

          QUEUE_URL="${{ steps.trigger_jenkins_job.outputs.queue_url }}"
          QUEUE_API_URL="${QUEUE_URL%/}/api/json"
          MAX_QUEUE_ATTEMPTS=60
          MAX_BUILD_ATTEMPTS=180
          ATTEMPT=0
          BUILD_URL=""

          while [ "$ATTEMPT" -lt "$MAX_QUEUE_ATTEMPTS" ]; do
            RESPONSE=$(curl --fail --silent --show-error -u "jenkinsdeployuser:${{ secrets.JENKINS_TOKEN }}" "$QUEUE_API_URL")
            CANCELLED=$(echo "$RESPONSE" | jq -r '.cancelled // false')
            BUILD_URL=$(echo "$RESPONSE" | jq -r '.executable.url // empty')

            if [ "$CANCELLED" == "true" ]; then
              echo "Jenkins queue item was cancelled before starting."
              exit 1
            fi

            if [ -n "$BUILD_URL" ]; then
              echo "Resolved Jenkins build URL: $BUILD_URL"
              break
            fi

            WHY=$(echo "$RESPONSE" | jq -r '.why // "Waiting for executor"')
            echo "Job is still queued: $WHY"
            ATTEMPT=$((ATTEMPT + 1))
            sleep 5
          done

          if [ -z "$BUILD_URL" ]; then
            echo "Timed out waiting for Jenkins to assign a build number."
            exit 1
          fi

          ATTEMPT=0
          BUILD_API_URL="${BUILD_URL%/}/api/json"

          while [ "$ATTEMPT" -lt "$MAX_BUILD_ATTEMPTS" ]; do
            RESPONSE=$(curl --fail --silent --show-error -u "jenkinsdeployuser:${{ secrets.JENKINS_TOKEN }}" "$BUILD_API_URL")
            BUILDING=$(echo "$RESPONSE" | jq -r '.building // false')
            JOB_STATUS=$(echo "$RESPONSE" | jq -r '.result // empty')

            if [ "$BUILDING" == "true" ] || [ -z "$JOB_STATUS" ]; then
              echo "Jenkins build is still running..."
              ATTEMPT=$((ATTEMPT + 1))
              sleep 10
              continue
            fi

            echo "Current status: $JOB_STATUS"

            if [ "$JOB_STATUS" == "SUCCESS" ]; then
              echo "Jenkins job completed successfully."
              exit 0
            elif [ "$JOB_STATUS" == "FAILURE" ]; then
              echo "Jenkins job failed."
              exit 1
            elif [ "$JOB_STATUS" == "ABORTED" ]; then
              echo "Jenkins job was aborted."
              exit 2
            else
              echo "Unexpected Jenkins job status: $JOB_STATUS"
              exit 1
            fi
          done

          echo "Timed out waiting for Jenkins job to complete."
          exit 1
