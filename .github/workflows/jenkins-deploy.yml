name: Deploy package

on:
  workflow_call:
    inputs:
      branch:
        required: false
        type: string
      client:
        required: true
        type: string
      environment:
        required: true
        type: string
      hosts:
        required: false
        type: string
        default: "ALL"
      db_backup:
        required: false
        type: boolean
      run_clear_codegen_cache:
        required: false
        type: boolean
      run_genesis_install:
        required: false
        type: boolean
      run_install_hooks:
        required: false
        type: boolean
      run_remap:
        required: false
        type: boolean
      start_server:
        required: false
        type: boolean
      genesis_user:
        required: false
        type: string
      environment_level:
        required: false
        type: string
      product:
        required: false
        type: string
      package_version:
        required: false
        type: string
      repotype:
        required: false
        type: string
      testautomation_build:
        required: false
        default: false
        type: boolean
      deploy_custom_nginx:
        required: false
        default: false
        type: boolean

    secrets:
      JENKINS_SECURITYTOKEN:
        required: true
      JENKINS_TOKEN:
        required: false

jobs:
  build:
    name: Steps to Deploy package
    runs-on: appdev-small
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch }}

      - name: Trigger Jenkins Job
        run: |
          curl -X POST "https://jenkinsdev.cdservice.genesis.global/buildByToken/buildWithParameters?token=${{ secrets.JENKINS_SECURITYTOKEN }}&job=AppDev-CI_CD/${{ inputs.product }}/${{ inputs.environment_level }}/product_${{ inputs.product }}_upgrade" \
            --data-urlencode "client=${{ inputs.client }}" \
            --data-urlencode "environment=${{ inputs.environment }}" \
            --data-urlencode "hosts=${{ inputs.hosts }}" \
            --data-urlencode "package_version=${{ inputs.package_version }}" \
            --data-urlencode "db_backup=${{ inputs.db_backup }}" \
            --data-urlencode "run_clear_codegen_cache=${{ inputs.run_clear_codegen_cache }}" \
            --data-urlencode "run_genesis_install=${{ inputs.run_genesis_install }}" \
            --data-urlencode "run_install_hooks=${{ inputs.run_install_hooks }}" \
            --data-urlencode "run_remap=${{ inputs.run_remap }}" \
            --data-urlencode "start_server=${{ inputs.start_server }}" \
            --data-urlencode "genesis_user=${{ inputs.genesis_user }}" \
            --data-urlencode "environment_level=${{ inputs.environment_level }}" \
            --data-urlencode "product=${{ inputs.product }}" \
            --data-urlencode "repotype=${{ inputs.repotype }}" \
            --data-urlencode "deploy_custom_nginx=${{ inputs.deploy_custom_nginx }}"

      - name: Install jq
        run: sudo dnf install -y jq

      - name: Wait for Jenkins Job Completion
        if: ${{ inputs.testautomation_build }}
        run: |
          JOB_URL="https://jenkinsdev.cdservice.genesis.global/job/AppDev-CI_CD/job/${{ inputs.product }}/job/${{ inputs.environment_level }}/job/product_${{ inputs.product }}_upgrade"

          # Wait for a new job to start
          LAST_BUILD=$(curl -s "${JOB_URL}/lastBuild/api/json" | jq -r '.number')
          echo "Last build number: $LAST_BUILD"

          while true; do
            NEW_BUILD=$(curl -s "${JOB_URL}/lastBuild/api/json" | jq -r '.number')
            if [ "$NEW_BUILD" != "$LAST_BUILD" ] && [ "$NEW_BUILD" != "null" ]; then
              echo "New build detected: $NEW_BUILD"
              break
            fi
            echo "Waiting for Jenkins job to start..."
            sleep 5
          done

          # Poll job status
          STATUS_URL="${JOB_URL}/lastBuild/api/json"
          TIMEOUT=600  # 10 minutes
          ELAPSED=0
          while [ $ELAPSED -lt $TIMEOUT ]; do
            RESPONSE=$(curl -s "${STATUS_URL}")
            JOB_STATUS=$(echo "$RESPONSE" | jq -r '.result')

            if [ "$JOB_STATUS" == "SUCCESS" ]; then
              echo "Jenkins job completed successfully."
              exit 0
            elif [ "$JOB_STATUS" == "FAILURE" ]; then
              echo "Jenkins job failed."
              exit 1
            elif [ "$JOB_STATUS" == "ABORTED" ]; then
              echo "Jenkins job was aborted."
              exit 2
            elif [ -z "$JOB_STATUS" ] || [ "$JOB_STATUS" == "null" ]; then
              echo "Job is still running..."
              sleep 10
              ((ELAPSED+=10))
            else
              echo "Unexpected job status: $JOB_STATUS"
              exit 3
            fi
          done

          echo "Jenkins job did not complete within timeout."
          exit 4
