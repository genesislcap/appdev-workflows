name: Deploy package

on:
  workflow_call:
    inputs:
      branch:
        required: false
        type: string
      client:
        required: true
        type: string
      environment:
        required: true
        type: string
      hosts:
        required: false
        type: string
        default: "ALL"
      db_backup:
        required: false
        type: boolean
      run_clear_codegen_cache:
        required: false
        type: boolean
      run_genesis_install:
        required: false
        type: boolean
      run_install_hooks:
        required: false
        type: boolean
      run_remap:
        required: false
        type: boolean
      start_server:
        required: false
        type: boolean
      genesis_user:
        required: false
        type: string
      environment_level:
        required: false
        type: string
      product:
        required: false
        type: string
      package_version:
        required: false
        type: string
      repotype:
        required: false
        type: string
      testautomation_build:
        required: false
        default: false
        type: boolean
      deploy_custom_nginx:
        required: false
        default: false
        type: boolean

    secrets:
      JENKINS_SECURITYTOKEN:
        required: true
      JENKINS_TOKEN:
        required: false

jobs:
  build:
    name: Steps to Deploy package
    runs-on: appdev-small
    environment: master

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: '0'
          ref: ${{ inputs.branch }}

      - name: Install jq
        if: ${{ inputs.testautomation_build }}
        run: sudo dnf install -y jq

      - name: Poll Jenkins for Job Status
        if: ${{ inputs.testautomation_build }}
        run: |
          JOB_URL="https://jenkinsdev.cdservice.genesis.global/buildByToken/buildWithParameters"

          RESPONSE=$(curl -X POST "$JOB_URL" \
            --data-urlencode "token=${{ secrets.JENKINS_SECURITYTOKEN }}" \
            --data-urlencode "job=AppDev-CI_CD/${{ inputs.product }}/${{ inputs.environment_level }}/product_${{ inputs.product }}_upgrade" \
            --data-urlencode "client=${{ inputs.client }}" \
            --data-urlencode "environment=${{ inputs.environment }}" \
            --data-urlencode "hosts=${{ inputs.hosts }}" \
            --data-urlencode "package_version=${{ inputs.package_version }}" \
            --data-urlencode "db_backup=${{ inputs.db_backup }}" \
            --data-urlencode "run_clear_codegen_cache=${{ inputs.run_clear_codegen_cache }}" \
            --data-urlencode "run_genesis_install=${{ inputs.run_genesis_install }}" \
            --data-urlencode "run_install_hooks=${{ inputs.run_install_hooks }}" \
            --data-urlencode "run_remap=${{ inputs.run_remap }}" \
            --data-urlencode "start_server=${{ inputs.start_server }}" \
            --data-urlencode "genesis_user=${{ inputs.genesis_user }}" \
            --data-urlencode "environment_level=${{ inputs.environment_level }}" \
            --data-urlencode "product=${{ inputs.product }}" \
            --data-urlencode "repotype=${{ inputs.repotype }}" \
            --data-urlencode "deploy_custom_nginx=${{ inputs.deploy_custom_nginx }}" )

          # Debugging: Print response to check if it's valid JSON
          echo "Jenkins API Response: $RESPONSE"

          # Check if response contains authentication failure message
          if echo "$RESPONSE" | grep -q "Unauthorized"; then
            echo "Error: Jenkins authentication failed. Check JENKINS_SECURITYTOKEN."
            exit 5
          fi

          # Check if RESPONSE is valid JSON before using jq
          if echo "$RESPONSE" | jq empty 2>/dev/null; then
            JOB_STATUS=$(echo "$RESPONSE" | jq -r .result)
          else
            echo "Error: Invalid JSON response from Jenkins API."
            exit 4
          fi

          echo "Current status: $JOB_STATUS"
          if [ "$JOB_STATUS" == "SUCCESS" ]; then
            echo "Jenkins job completed successfully."
            exit 0
          elif [ "$JOB_STATUS" == "FAILURE" ]; then
            echo "Jenkins job failed."
            exit 1
          elif [ "$JOB_STATUS" == "ABORTED" ]; then
            echo "Jenkins job was aborted."
            exit 2
          fi

          echo "Job is still running..."
          sleep 10
          ((ATTEMPTS++))

          if [ $ATTEMPTS -ge $MAX_ATTEMPTS ]; then
            echo "Jenkins job polling timed out."
            exit 3
          fi
