name: Data Archive

on:
  workflow_call:
    inputs:
      db_host:
        required: false
        type: string
      db_schema:
        required: true
        type: string
      new_schema:
        required: false
        type: string
      db_user:
        required: false
        type: string
      db_name:
        required: false
        type: string
      client_name:
        required: false
        type: string
      region_name:
        required: false
        default: 'eu-west-2'
        type: string
    # secrets:
    #   GRADLE_PROPERTIES:
    #     required: true


jobs:
  fetch-aws-credentials:
    runs-on: [ appdev-selfhosted-al2023 ]
    outputs:
      AWS_ACCESS_KEY_ID: ${{ steps.set-creds.outputs.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ steps.set-creds.outputs.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ steps.set-creds.outputs.AWS_SESSION_TOKEN }}

    env:
      SSM_PARAM_NAME: githubrunner-cddev-policy
      REGION: eu-west-2

    steps:

      - name: Print Input Values
        run: |
          echo "db_host: ${{ inputs.db_host }}"
          echo "db_schema: ${{ inputs.db_schema }}"
          echo "db_user: ${{ inputs.db_user }}"
          echo "db_name: ${{ inputs.db_name }}"
          echo "region_name: ${{ inputs.region_name }}"


      - name: Install AWS CLI and jq
        run: |
          sudo dnf update -y
          sudo dnf install -y awscli jq

      - name: Fetch and Assume AWS Role
        id: set-creds
        run: |
          unset AWS_ACCESS_KEY_ID
          unset AWS_SECRET_ACCESS_KEY
          unset AWS_SESSION_TOKEN

          aws_ssm_param_arn=$(aws ssm get-parameter --name $SSM_PARAM_NAME --region=$REGION --with-decryption --query "Parameter.Value")

          aws_credentials_json=$(aws sts assume-role --role-arn ${aws_ssm_param_arn//\"/} --role-session-name githubActionSession --duration 3600 --region $REGION)

          echo "AWS_ACCESS_KEY_ID=$(echo $aws_credentials_json | jq -r .Credentials.AccessKeyId)" >> $GITHUB_OUTPUT
          echo "AWS_SECRET_ACCESS_KEY=$(echo $aws_credentials_json | jq -r .Credentials.SecretAccessKey)" >> $GITHUB_OUTPUT
          echo "AWS_SESSION_TOKEN=$(echo $aws_credentials_json | jq -r .Credentials.SessionToken)" >> $GITHUB_OUTPUT

  postgres-dump:
    runs-on: [ appdev-selfhosted-al2023 ]
    needs: fetch-aws-credentials

    env:
      DB_USER: ${{ inputs.db_user }}
      DB_PASSWORD: Password11*
      REGION: ${{ inputs.region_name }}
      AWS_ACCESS_KEY_ID: ${{ needs.fetch-aws-credentials.outputs.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ needs.fetch-aws-credentials.outputs.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ needs.fetch-aws-credentials.outputs.AWS_SESSION_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set Up Docker Buildx
        run: |
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
          docker buildx create --use

      - name: Create PostgreSQL database dump using Docker
        run: |
          sudo docker pull postgres:17

          sudo docker run --rm \
            -e PGPASSWORD=$DB_PASSWORD \
            postgres:17 \
            pg_dump \
            -h ${{ inputs.db_host }} \
            -U ${{ inputs.db_user }} \
            -d ${{ inputs.db_name }} \
            -n ${{ inputs.db_schema }} > ${{ inputs.db_schema }}.sql

      - name: Determine effective schema name
        run: |
          if [[ -z "${{ inputs.new_schema }}" ]]; then
            echo "Using db_schema as new_schema since new_schema is empty"
            echo "EFFECTIVE_SCHEMA=${{ inputs.db_schema }}" >> $GITHUB_ENV
          else
            echo "Using provided new_schema"
            echo "EFFECTIVE_SCHEMA=${{ inputs.new_schema }}" >> $GITHUB_ENV
          fi


      # - name: Replace schema name in SQL dump
      #   run: |
      #     echo "Replacing schema name from '${{ inputs.db_schema }}' to '$EFFECTIVE_SCHEMA'..."
      #     sed -i "s/\\b${{ inputs.db_schema }}\\b/$EFFECTIVE_SCHEMA/g" ${{ inputs.db_schema }}.sql

      - name: Create Dockerfile
        run: |
          cat <<EOF > Dockerfile
          FROM postgres:latest
          ENV POSTGRES_DB=postgres
          ENV POSTGRES_USER=${DB_USER}
          ENV POSTGRES_PASSWORD=${DB_PASSWORD}
          COPY ${{ inputs.db_schema }}.sql /docker-entrypoint-initdb.d/init.sql

          RUN echo "max_connections = 2000" >> /usr/share/postgresql/postgresql.conf.sample
          RUN mkdir -p /docker-entrypoint-initdb.d && echo "max_connections = 2000" > /docker-entrypoint-initdb.d/pg_config.conf

          EXPOSE 5432
          EOF

      - name: Build and Save ARM64 Image
        run: |
          docker buildx build --platform linux/arm64 -t pgdbimage . --load
          TAR_FILE="$EFFECTIVE_SCHEMA-ARM.tar"
          sudo docker save -o $TAR_FILE pgdbimage
          sudo chmod +r $TAR_FILE

      - name: Rename existing S3 file
        run: |
          aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID --profile default
          aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY --profile default
          aws configure set aws_session_token $AWS_SESSION_TOKEN --profile default
          aws configure set region $REGION --profile default

          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          ARCHS=("ARM")

          for ARCH in "${ARCHS[@]}"; do
            OLD_FILE="$EFFECTIVE_SCHEMA-$ARCH.tar"
            NEW_FILE="$EFFECTIVE_SCHEMA-$ARCH-${TIMESTAMP}.tar"

            if [[ -n "${{ inputs.client_name }}" ]]; then
              S3_PATH="s3://genesis-cddev/qa-automation/$EFFECTIVE_SCHEMA/${{ inputs.client_name }}"
            else
              S3_PATH="s3://genesis-cddev/qa-automation/$EFFECTIVE_SCHEMA"
            fi

            if aws s3 ls "$S3_PATH/$OLD_FILE" 2>/dev/null | grep -q "$OLD_FILE"; then
              aws s3 mv "$S3_PATH/$OLD_FILE" "$S3_PATH/$NEW_FILE"
            fi
          done

      - name: Upload Docker image to S3
        run: |
          aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID --profile default
          aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY --profile default
          aws configure set aws_session_token $AWS_SESSION_TOKEN --profile default
          aws configure set region $REGION --profile default

          if [[ -n "${{ inputs.client_name }}" ]]; then
            S3_PATH="s3://genesis-cddev/qa-automation/$EFFECTIVE_SCHEMA/${{ inputs.client_name }}"
          else
            S3_PATH="s3://genesis-cddev/qa-automation/$EFFECTIVE_SCHEMA"
          fi

          aws s3 cp $EFFECTIVE_SCHEMA-ARM.tar "$S3_PATH/" --region $REGION

      - name: Clean up
        run: |
          sudo rm -f ${{ inputs.db_schema }}.sql
          sudo rm -f $EFFECTIVE_SCHEMA-ARM.tar
