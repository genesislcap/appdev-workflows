# This is a workflow calling the steps-jobs from appdev-devops repo which has the main file
name: Gradle Build

on:
  workflow_call:
    inputs:
      branch:
        required: false
        type: string
      repo-name:
        required: false
        type: string
      product_name:
        required: true
        type: string
      version:
        required: false
        type: string
      upload:
        required: false
        type: boolean
        default: true
      build_docker:
        required: false
        default: false
        type: boolean
      java_version:
        required: false
        default: '17'
        type: string
      node_version:
        required: false
        default: '20.x'
        type: string
      use-artifactory-cache:
        type: boolean
        description: Use to the Artifactory cache
        default: false
        required: false
      push-to-artifactory-cache:
        type: boolean
        description: Push to the Artifactory cache
        default: false
        required: false
      working-directory:
        type: string
        default: .
        required: false
      server-build-gradle-arguments:
        type: string
        description: Additional arguments/properties to be passed to the server gradle build command
        required: false
      server-install-gradle-arguments:
        type: string
        description: Additional arguments/properties to be passed to the server gradle instal-* commands
        required: false
      publish-to-artifactory:
        type: boolean
        description: Publish to artifactory libs-release-local or lib-release-client
        default: false
        required: false
      REGISTRY_URL:
        type: string
        description: Only used by the older version of genesisframework
        required: false
      SCOPE:
        type: string
        description: Only used by the older version of genesisframework if SCOPE is used then REGISTRY_URL has to be passed
        required: false
      config-path:
        type: string
        description: Environment file used to set the action context before building the artifacts, useful when the same project is built for different profiles/customers
        required: false
      test-reports-suffix:
        type: string
        description: The suffix to be added to test reports uploaded artifact to be used in case of matrix builds to avoid clashes.
        required: false
      update-jira:
        type: boolean
        required: false
        default: false
      sonar_enabled:
        type: boolean
        required: false
        default: false

      testautomation_build:
        required: false
        default: false
        type: boolean
      testautorepo:
        required: false
        type: string
      testautobranch:
        required: false
        type: string

      server-path:
        required: false
        type: string
        default: 'server'
      FOUNDATION_VERSION:
        required: false
        type: string
      web-path:
        required: false
        type: string
        default: 'client'
      additional_file:
        required: false
        type: string
        default: 'main-repo/.github/workflows/serverversion.properties'
      sast:
        required: false
        type: string
        default: false

    secrets:
      GRADLE_PROPERTIES:
        required: true
      JFROG_USERNAME:
        required: true
      JFROG_EMAIL:
        required: true
      JFROG_PASSWORD:
        required: true
      GPR_READ_TOKEN:
        required: true
      SLACK_WEBHOOK:
        required: false
      JFROG_NPM_AUTH_TOKEN:
        required: false
      GHA_TOKEN:
        required: true
      JENKINSGENESIS_SONAR:
        required: false

env:
  NODE_AUTH_TOKEN: ${{secrets.GPR_READ_TOKEN}}
  DISTRIBUTION_DIR: ${{ inputs.distribution_dir || format('{0}-distribution', inputs.product_name) }}
  GHA_TOKEN: ${{secrets.GHA_TOKEN}}

# A workflow run is called from the devops appdev-workflow repos
jobs:
  build-server:
    runs-on: [ appdev-selfhosted-al2023 ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'
          ref: ${{ inputs.branch }}

      # - uses: actions/checkout@v3
      #   if: inputs.testautomation_build
      #   with:
      #     repository: ${{ inputs.testautorepo }}
      #     fetch-depth: '0'
      #     ref: ${{ inputs.testautobranch }}
      #     token: ${{ env.GHA_TOKEN }}

      - name: Set up JDK
        uses: actions/setup-java@v2
        with:
          java-version: ${{ inputs.java_version }}
          distribution: 'adopt'

      - name: Configure Node  ${{ inputs.node_version }}
        if: ${{ !inputs.REGISTRY_URL  }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ inputs.node_version }}

      - name: Configure Node  ${{ inputs.node_version }} if using JFROG npm packages
        if: ${{ inputs.REGISTRY_URL }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ inputs.node_version }}
          registry-url: ${{ inputs.REGISTRY_URL }}
          scope: ${{ inputs.SCOPE }}
        env:
          NODE_AUTH_TOKEN: ${{secrets.GPR_READ_TOKEN}}

      - name: Setup npm registry for @genesislcap
        run: |
          echo "Using npmjs.com for @genesislcap scoped packages"
          npm config set @genesislcap:registry https://registry.npmjs.org/
          npm config list
        env:
          NODE_AUTH_TOKEN: ${{secrets.GPR_READ_TOKEN}}


      # - name: Checkout main repository
      #   if: inputs.testautomation_build
      #   uses: actions/checkout@v3
      #   with:
      #     repository: genesislcap/platform-qa-automation
      #     ref: ${{ github.ref }}
      #     token: ${{ secrets.GHA_TOKEN }}
      #     path: main-repo

      - name: testautomation_build steps
        if: inputs.testautomation_build
        uses: genesislcap/appdev-workflows/testautomation-action@qaautomation
        with:
          web-path: ${{ inputs.web-path }}
          server-path: ${{ inputs.server-path }}
          testautomation_build: ${{ inputs.testautomation_build }}
          testautorepo: ${{ inputs.testautorepo }}
          testautobranch: ${{ inputs.testautobranch }}
          additional_file: ${{ inputs.additional_file }}
          repo_type: "web"
          GHA_TOKEN: ${{secrets.GHA_TOKEN}}

      - name: Restore gradle.properties and setup
        env:
          GRADLE_PROPERTIES: ${{ secrets.GRADLE_PROPERTIES }}
        working-directory: "${{ inputs.working-directory }}"
        shell: bash
        run: |
          mkdir -p ~/.gradle/
          echo "GRADLE_USER_HOME=${HOME}/.gradle" >> $GITHUB_ENV
          echo "genesisArtifactoryUser=${{ secrets.JFROG_USERNAME }}" >> ~/.gradle/gradle.properties
          echo "genesisArtifactoryPassword=${{ secrets.JFROG_PASSWORD }}" >> ~/.gradle/gradle.properties

          echo "systemProp.org.gradle.internal.http.connectionTimeout=180000" >> ~/.gradle/gradle.properties
          echo "systemProp.org.gradle.internal.http.socketTimeout=180000" >> ~/.gradle/gradle.properties

          echo "dockerUrl=genesisglobal-docker-internal.jfrog.io" >> ~/.gradle/gradle.properties
          echo "dockerUsername=${{ secrets.JFROG_USERNAME }}" >> ~/.gradle/gradle.properties
          echo "dockerPassword=${{ secrets.JFROG_PASSWORD }}" >> ~/.gradle/gradle.properties
          echo "dockerEmail=platformmanageteam@genesis.global" >> ~/.gradle/gradle.properties

          echo "genesis-home=../.genesis-home" >> ~/.gradle/gradle.properties
          echo "deploy-plugin-mode=local" >> ~/.gradle/gradle.properties
          sudo chmod +x ./gradlew
          sudo chmod +x ./server/gradlew

          # # Append contents of additional file to gradle.properties based on condition
          # if [ "${{ inputs.testautomation_build }}" == "true" ]; then
          #   echo "Appending contents of additional file to gradle.properties"
          #   if [ -f "${{ inputs.working-directory }}/${{ inputs.additional_file }}" ]; then
          #     cat ${{ inputs.additional_file }} >> ~/.gradle/gradle.properties
          #   else
          #     echo "Additional file not found: ${{ inputs.additional_file }}" >&2
          #   fi
          # fi

          # # Print the gradle.properties file for verification
          # echo "Contents of gradle.properties after modification:"
          # cat ~/.gradle/gradle.properties


          cat ~/.gradle/gradle.properties >>  ./gradle.properties
          if [ -z "${{ inputs.repo-name }}" ]; then
            echo "REPO_NAME=$(echo '${{ github.event.repository.name }}' | cut -d'-' -f1)" >> $GITHUB_ENV
          else
            echo "REPO_NAME=${{ inputs.repo-name }}" >> $GITHUB_ENV
          fi
          RELEASE_VERSION=$(echo "${{ inputs.version }}" | sed 's/\//-/g')
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> $GITHUB_ENV
          sed -E -i "s/^\s{4}version = \".+\"/    version = \"${RELEASE_VERSION}\"/g" server/build.gradle.kts

