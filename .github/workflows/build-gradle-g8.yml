      - name: Run Bearer and generate report
        uses: bearer/bearer-action@v2
        with:
          format: json
          output: bearer-report.txt   # This will create the .txt file

      - name: Upload Bearer Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bearer-security-report
          path: bearer-report.txt

      - name: Server Build
        uses: gradle/gradle-build-action@v2
        with:
          arguments: build --no-build-cache --refresh-dependencies --stacktrace -Pversion=${{ env.RELEASE_VERSION }} -PpushToCache=${{ inputs.push-to-artifactory-cache }} -PdisableRemoteCache=${{ !inputs.use-artifactory-cache }} ${{ inputs.server-build-gradle-arguments }}
          build-root-directory: "${{ inputs.working-directory }}"
          cache-disabled: true

      - name: Test and Coverage
        uses: gradle/gradle-build-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.JENKINSGENESIS_SONAR }}
        with:
          arguments: >
            test jacocoTestReport sonarqube --no-configuration-cache
            -Dsonar.token=${{ env.SONAR_TOKEN }}
          build-root-directory: "${{ inputs.working-directory }}/${{ inputs.server-path }}"
          cache-disabled: true

      - name: Copy Test Reports
        working-directory: "${{ inputs.working-directory }}"
        run: |
          for dir in /opt/actions-runner/_work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/server/*/build/reports/tests/test/; do
            if [ -d "$dir" ]; then
              subfolder_name=$(echo "$dir" | sed 's/.*\/jvm\///')
              echo "Subfolder Name: $subfolder_name"
              mkdir -p "test-results/$subfolder_name"
              cp -r "$dir"/* "test-results/$subfolder_name/"
            fi
          done
        if: always()

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        with:
          name: server-test-reports-${{ inputs.product_name }}
          path: "${{ inputs.working-directory }}/test-results"
        if: always()

      - name: Docker Build Image
        if: inputs.build_docker
        uses: gradle/gradle-build-action@v2
        with:
          arguments: :genesisproduct-${{ inputs.product_name }}:${{ inputs.product_name }}-deploy:buildImage
          build-root-directory: "${{ inputs.working-directory }}/"
          cache-disabled: true

      - name: Docker Push Image
        if: inputs.build_docker
        uses: gradle/gradle-build-action@v2
        with:
          arguments: :genesisproduct-${{ inputs.product_name }}:${{ inputs.product_name }}-deploy:pushImage
          build-root-directory: "${{ inputs.working-directory }}/"
          cache-disabled: true

      - name: Create Giant Server Zip
        if: inputs.upload
        shell: bash
        working-directory: "${{ inputs.working-directory }}/server"
        run: |
          ./gradlew tasks -Pversion=${{ env.RELEASE_VERSION }} | grep install- | cut -d " " -f1 | xargs -I{} ./gradlew -Pversion=${{ env.RELEASE_VERSION }} {} ${{ inputs.server-install-gradle-arguments }}
          cd .genesis-home
          pwd
          ls -la
          tar czvf ../build/distributions/genesis_${{ inputs.product_name }}_package-${{ env.RELEASE_VERSION }}.tar.gz *


      - name: Upload Server Package
        if: inputs.upload
        working-directory: "${{ inputs.working-directory }}/server/build/distributions/"
        run: |
          ls -l
          echo "${{ env.REPO_NAME }}"
          curl -u ${{ secrets.JFROG_USERNAME }}:"${{secrets.JFROG_PASSWORD}}" -X PUT "https://genesisglobal.jfrog.io/artifactory/product/${{ env.REPO_NAME }}/server/" -T genesisproduct*.zip
          curl -u ${{ secrets.JFROG_USERNAME }}:"${{secrets.JFROG_PASSWORD}}" -X PUT "https://genesisglobal.jfrog.io/artifactory/product/${{ env.REPO_NAME }}/server/" -T genesis_${{ inputs.product_name }}_package-${{ env.RELEASE_VERSION }}.tar.gz

      - name: Upload Web Package
        if: inputs.upload
        working-directory: ${{ inputs.working-directory }}
        run: |
          if test -f client/build/distributions/web-distribution-${{ env.RELEASE_VERSION }}.zip; then
            mv client/build/distributions/web-distribution-${{ env.RELEASE_VERSION }}.zip client/build/distributions/${{ env.REPO_NAME }}-web-${{ env.RELEASE_VERSION }}.zip
            curl -u ${{ secrets.JFROG_USERNAME }}:"${{secrets.JFROG_PASSWORD}}" -X PUT "https://genesisglobal.jfrog.io/artifactory/product/${{ env.REPO_NAME }}/web/" -T client/build/distributions/*.zip
          fi

      # - name: Upload Web Package
      #   if: inputs.upload
      #   working-directory: ${{ inputs.working-directory }}
      #   run: |
      #     if test -f client/build/distributions/web-distribution.zip; then
      #       mv client/build/distributions/web-distribution.zip client/build/distributions/${{ env.REPO_NAME }}-web-${{ env.RELEASE_VERSION }}.zip
