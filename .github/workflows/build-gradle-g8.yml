      # - name: Server Build
      #   uses: gradle/gradle-build-action@v2
      #   with:
      #     arguments: build  --no-build-cache --stacktrace -PpushToCache=${{ inputs.push-to-artifactory-cache }} -PdisableRemoteCache=${{ !inputs.use-artifactory-cache }} ${{ inputs.server-build-gradle-arguments }} -PuseDevRepo=true
      #     build-root-directory: "${{ inputs.working-directory }}"
