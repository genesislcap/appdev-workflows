name: SendIt (repository dispatch)

on:
  repository_dispatch:
    types: [sendit_requested]

jobs:
  sendit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Validate client payload
        env:
          APP_NAME: ${{ github.event.client_payload.app_name }}
          ENV_NAME: ${{ github.event.client_payload.environment }}
          CORR: ${{ github.event.client_payload.correlation_id }}
        run: |
          if [ -z "$APP_NAME" ]; then echo "::error::client_payload.app_name is required"; exit 1; fi
          if [ -z "$ENV_NAME" ]; then echo "::error::client_payload.environment is required"; exit 1; fi
          {
            echo "## SendIt repository_dispatch"
            echo "- **correlation_id**: ${CORR:-"(not set)"}"
            echo "- **app_name**: $APP_NAME"
            echo "- **environment**: $ENV_NAME"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run SendIt composite
        uses: ./sendit/action.yaml
        with:
          environment: ${{ github.event.client_payload.environment }}
          app_name: ${{ github.event.client_payload.app_name }}
          aws-access-key-id: ${{ secrets.SENDIT_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.SENDIT_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.SENDIT_AWS_REGION }}
