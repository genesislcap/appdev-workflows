name: SendIt (repository dispatch)

on:
  repository_dispatch:
    types: [sendit_requested]

jobs:
  sendit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Validate client payload
        env:
          APP_NAME: ${{ github.event.client_payload.app_name }}
          ENV_NAME: ${{ github.event.client_payload.environment }}
          CORR: ${{ github.event.client_payload.correlation_id }}
          AWS_ACCESS_KEY_ID: ${{ github.event.client_payload.aws_access_key_id }}
          AWS_SECRET_ACCESS_KEY: ${{ github.event.client_payload.aws_secret_access_key }}
          AWS_SESSION_TOKEN: ${{ github.event.client_payload.aws_session_token }}
          AWS_REGION: ${{ github.event.client_payload.aws_region }}
        run: |
          if [ -z "$APP_NAME" ]; then echo "::error::client_payload.app_name is required"; exit 1; fi
          if [ -z "$ENV_NAME" ]; then echo "::error::client_payload.environment is required"; exit 1; fi
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then echo "::error::client_payload.aws_access_key_id is required"; exit 1; fi
          if [ -z "$AWS_SECRET_ACCESS_KEY" ]; then echo "::error::client_payload.aws_secret_access_key is required"; exit 1; fi
          if [ -z "$AWS_REGION" ]; then echo "::error::client_payload.aws_region is required"; exit 1; fi
          {
            echo "## SendIt repository_dispatch"
            echo "- **correlation_id**: ${CORR:-"(not set)"}"
            echo "- **app_name**: $APP_NAME"
            echo "- **environment**: $ENV_NAME"
            echo "- **aws_region**: $AWS_REGION"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run SendIt composite
        uses: genesislcap/appdev-workflows/sendit@lukask/DCD-4500-send-it-script
        with:
          environment: ${{ github.event.client_payload.environment }}
          app_name: ${{ github.event.client_payload.app_name }}
          aws-access-key-id: ${{ github.event.client_payload.aws_access_key_id }}
          aws-secret-access-key: ${{ github.event.client_payload.aws_secret_access_key }}
          aws-session-token: ${{ github.event.client_payload.aws_session_token }}
          aws-region: ${{ github.event.client_payload.aws_region }}
