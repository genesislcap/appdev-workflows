name: Data Archive based on TAG

on:
  workflow_call:
    inputs:
      db_schema:
        required: true
        type: string
      client_name:
        required: false
        type: string
      region_name:
        required: false
        default: 'eu-west-2'
        type: string
      version:
        required: false
        type: string

jobs:
  fetch-aws-credentials:
    runs-on: [appdev-selfhosted-al2023]
    outputs:
      AWS_ACCESS_KEY_ID: ${{ steps.set-creds.outputs.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ steps.set-creds.outputs.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ steps.set-creds.outputs.AWS_SESSION_TOKEN }}
    env:
      SSM_PARAM_NAME: githubrunner-cddev-policy
      REGION: eu-west-2
    steps:
      - name: Ensure AWS CLI and jq
        run: |
          set -euo pipefail
          if ! command -v aws >/dev/null 2>&1; then sudo dnf install -y awscli; fi
          if ! command -v jq  >/dev/null 2>&1; then sudo dnf install -y jq; fi

      - name: Assume role from SSM
        id: set-creds
        run: |
          set -euo pipefail
          unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
          ROLE_ARN=$(aws ssm get-parameter --name "$SSM_PARAM_NAME" --region "$REGION" --with-decryption --query 'Parameter.Value' --output text)
          CREDS=$(aws sts assume-role --role-arn "$ROLE_ARN" --role-session-name githubActionSession --duration-seconds 3600 --region "$REGION")
          echo "AWS_ACCESS_KEY_ID=$(echo "$CREDS" | jq -r .Credentials.AccessKeyId)"       >> "$GITHUB_OUTPUT"
          echo "AWS_SECRET_ACCESS_KEY=$(echo "$CREDS" | jq -r .Credentials.SecretAccessKey)" >> "$GITHUB_OUTPUT"
          echo "AWS_SESSION_TOKEN=$(echo "$CREDS" | jq -r .Credentials.SessionToken)"        >> "$GITHUB_OUTPUT"

  postgres-dump:
    runs-on: [appdev-selfhosted-al2023]
    needs: fetch-aws-credentials
    env:
      AWS_ACCESS_KEY_ID: ${{ needs.fetch-aws-credentials.outputs.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ needs.fetch-aws-credentials.outputs.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ needs.fetch-aws-credentials.outputs.AWS_SESSION_TOKEN }}
      REGION: ${{ inputs.region_name }}
      SCHEMA: ${{ inputs.db_schema }}
      IN_VERSION: ${{ inputs.version }}
      IN_CLIENTS: ${{ inputs.client_name }}   # e.g. "hsbc,bofa"
    steps:
      - name: Resolve version
        id: resolve
        run: |
          set -euo pipefail
          VERSION="${IN_VERSION:-${GITHUB_REF_NAME:-}}"
          if [ -z "$VERSION" ]; then
            echo "::error::No version provided; pass inputs.version or call from a tag context."
            exit 1
          fi
          echo "EFFECTIVE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Configure AWS CLI
        run: |
          set -euo pipefail
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID" --profile default
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY" --profile default
          aws configure set aws_session_token "$AWS_SESSION_TOKEN" --profile default
          aws configure set region "$REGION" --profile default
          export AWS_DEFAULT_REGION="$REGION"
          aws sts get-caller-identity >/dev/null

      - name: Copy/tag for each client
        run: |
          set -euo pipefail
          IFS=',' read -r -a CLIENTS <<< "$(echo "${IN_CLIENTS:-}" | tr '[:upper:]' '[:lower:]' | tr -d ' ')"
          # If empty, still run once with no client subfolder
          if [ "${#CLIENTS[@]}" -eq 0 ] || [ -z "${CLIENTS[0]}" ]; then
            CLIENTS=("")
          fi

          for CLIENT in "${CLIENTS[@]}"; do
            if [ -n "$CLIENT" ]; then
              S3_PATH="s3://genesis-cddev/qa-automation/${SCHEMA}/${CLIENT}"
              S3_KEY_PREFIX="qa-automation/${SCHEMA}/${CLIENT}"
              echo "Processing client=$CLIENT"
            else
              S3_PATH="s3://genesis-cddev/qa-automation/${SCHEMA}"
              S3_KEY_PREFIX="qa-automation/${SCHEMA}"
              echo "Processing client=<none>"
            fi

            SRC="${S3_PATH}/${SCHEMA}-ARM.tar"
            DST="${S3_PATH}/${SCHEMA}-ARM-${EFFECTIVE_VERSION}.tar"

            echo "Copying ${SRC} -> ${DST}"
            if aws s3 ls "${SRC}" >/dev/null 2>&1; then
              aws s3 cp "${SRC}" "${DST}"

              TAG_JSON="TagSet=[{Key=Version,Value=${EFFECTIVE_VERSION}},{Key=Schema,Value=${SCHEMA}}"
              if [ -n "$CLIENT" ]; then
                TAG_JSON="${TAG_JSON},{Key=Client,Value=${CLIENT}}"
              fi
              TAG_JSON="${TAG_JSON}]"

              aws s3api put-object-tagging \
                --bucket genesis-cddev \
                --key "${S3_KEY_PREFIX}/${SCHEMA}-ARM-${EFFECTIVE_VERSION}.tar" \
                --tagging "${TAG_JSON}"

              echo "Tagged: s3://genesis-cddev/${S3_KEY_PREFIX}/${SCHEMA}-ARM-${EFFECTIVE_VERSION}.tar"
            else
              echo "::warning::Source tar not found at ${SRC}; skipping."
            fi
          done
