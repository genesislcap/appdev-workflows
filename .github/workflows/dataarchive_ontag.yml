name: Data Archive

on:
  workflow_call:
    inputs:      
      db_schema:
        required: true
        type: string      
      client_name:
        required: false
        type: string
      region_name:
        required: false
        default: 'eu-west-2'
        type: string
    # secrets:
    #   GRADLE_PROPERTIES:
    #     required: true


jobs:
  fetch-aws-credentials:
    runs-on: [ appdev-selfhosted-al2023 ]
    outputs:
      AWS_ACCESS_KEY_ID: ${{ steps.set-creds.outputs.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ steps.set-creds.outputs.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ steps.set-creds.outputs.AWS_SESSION_TOKEN }}

    env:
      SSM_PARAM_NAME: githubrunner-cddev-policy
      REGION: eu-west-2

    steps:

      - name: Print Input Values
        run: |
         
          echo "db_schema: ${{ inputs.db_schema }}"
          echo "client_name: ${{ inputs.client_name }}"          
          echo "region_name: ${{ inputs.region_name }}"


      - name: Install AWS CLI and jq
        run: |
          sudo dnf update -y
          sudo dnf install -y awscli jq

      - name: Fetch and Assume AWS Role
        id: set-creds
        run: |
          unset AWS_ACCESS_KEY_ID
          unset AWS_SECRET_ACCESS_KEY
          unset AWS_SESSION_TOKEN

          aws_ssm_param_arn=$(aws ssm get-parameter --name $SSM_PARAM_NAME --region=$REGION --with-decryption --query "Parameter.Value")

          aws_credentials_json=$(aws sts assume-role --role-arn ${aws_ssm_param_arn//\"/} --role-session-name githubActionSession --duration 3600 --region $REGION)

          echo "AWS_ACCESS_KEY_ID=$(echo $aws_credentials_json | jq -r .Credentials.AccessKeyId)" >> $GITHUB_OUTPUT
          echo "AWS_SECRET_ACCESS_KEY=$(echo $aws_credentials_json | jq -r .Credentials.SecretAccessKey)" >> $GITHUB_OUTPUT
          echo "AWS_SESSION_TOKEN=$(echo $aws_credentials_json | jq -r .Credentials.SessionToken)" >> $GITHUB_OUTPUT

  postgres-dump:
    runs-on: [ appdev-selfhosted-al2023 ]
    needs: fetch-aws-credentials
    steps:
      - name: Determine effective schema name
        run: |          
            echo "EFFECTIVE_SCHEMA=${{ inputs.db_schema }}" >> $GITHUB_ENV
          
      - name: Tag S3 artifact (on Git tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          REGION: ${{ inputs.region_name }}
          AWS_ACCESS_KEY_ID: ${{ needs.fetch-aws-credentials.outputs.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ needs.fetch-aws-credentials.outputs.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ needs.fetch-aws-credentials.outputs.AWS_SESSION_TOKEN }}
        run: |
          # Configure AWS (idempotent)
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID" --profile default
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY" --profile default
          aws configure set aws_session_token "$AWS_SESSION_TOKEN" --profile default
          aws configure set region "$REGION" --profile default

          # Resolve S3 path (handles optional client_name)
          if [[ -n "${{ inputs.client_name }}" ]]; then
            S3_PATH="s3://genesis-cddev/qa-automation/$EFFECTIVE_SCHEMA/${{ inputs.client_name }}"
          else
            S3_PATH="s3://genesis-cddev/qa-automation/$EFFECTIVE_SCHEMA"
          fi

          # Tag from the ref, e.g. v1.2.3
          TAG="${GITHUB_REF_NAME}"

          SRC="$S3_PATH/$EFFECTIVE_SCHEMA-ARM.tar"
          DST="$S3_PATH/$EFFECTIVE_SCHEMA-ARM-${TAG}.tar"

          echo "Copying $SRC -> $DST"
          if aws s3 ls "$SRC" >/dev/null 2>&1; then
            aws s3 cp "$SRC" "$DST" --region "$REGION"
            echo "Tagged artifact created: $DST"
          else
            echo "::warning::Source tar not found at $SRC; skipping tag copy."
          fi

