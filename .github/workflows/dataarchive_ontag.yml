name: Data Archive

on:
  workflow_call:
    inputs:      
      db_schema:
        required: true
        type: string      
      client_name:
        required: false
        type: string
      region_name:
        required: false
        default: 'eu-west-2'
        type: string
      version:
        required: false
        type: string
    # secrets:
    #   GRADLE_PROPERTIES:
    #     required: true

jobs:
  postgres-dump:
    runs-on: [appdev-selfhosted-al2023]
    needs: fetch-aws-credentials
    env:
      AWS_ACCESS_KEY_ID: ${{ needs.fetch-aws-credentials.outputs.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ needs.fetch-aws-credentials.outputs.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ needs.fetch-aws-credentials.outputs.AWS_SESSION_TOKEN }}
      REGION: ${{ inputs.region_name }}
      SCHEMA: ${{ inputs.db_schema }}
      IN_VERSION: ${{ inputs.version }}
      IN_CLIENT_NAME: ${{ inputs.client_name }}

    steps:
      - name: Resolve version and client_name (use inputs as-is)
        id: resolve
        run: |
          set -euo pipefail

          # version must be present (either input or tag context)
          VERSION="${IN_VERSION:-${GITHUB_REF_NAME:-}}"
          if [ -z "${VERSION}" ]; then
            echo "::error::No version provided; pass inputs.version or call from a tag context."
            exit 1
          fi

          # client_name: use exactly what caller passed (normalize to lowercase/trim)
          CLIENT_NAME_RAW="${IN_CLIENT_NAME:-}"
          CLIENT_NAME="$(printf '%s' "$CLIENT_NAME_RAW" | tr '[:upper:]' '[:lower:]' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          echo "EFFECTIVE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "EFFECTIVE_CLIENT=$CLIENT_NAME" >> "$GITHUB_ENV"

          echo "Using VERSION=$VERSION"
          echo "Using CLIENT_NAME=${CLIENT_NAME:-<none>}"

      - name: Configure AWS CLI
        run: |
          set -euo pipefail
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID" --profile default
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY" --profile default
          aws configure set aws_session_token "$AWS_SESSION_TOKEN" --profile default
          aws configure set region "$REGION" --profile default
          export AWS_DEFAULT_REGION="$REGION"
          aws sts get-caller-identity >/dev/null

      - name: Tag/copy S3 artifact and apply object tags
        run: |
          set -euo pipefail

          if [ -n "${EFFECTIVE_CLIENT:-}" ]; then
            S3_PATH="s3://genesis-cddev/qa-automation/${SCHEMA}/${EFFECTIVE_CLIENT}"
            S3_KEY_PREFIX="qa-automation/${SCHEMA}/${EFFECTIVE_CLIENT}"
          else
            S3_PATH="s3://genesis-cddev/qa-automation/${SCHEMA}"
            S3_KEY_PREFIX="qa-automation/${SCHEMA}"
          fi

          SRC="${S3_PATH}/${SCHEMA}-ARM.tar"
          DST="${S3_PATH}/${SCHEMA}-ARM-${EFFECTIVE_VERSION}.tar"

          echo "Copying ${SRC} -> ${DST}"
          if aws s3 ls "${SRC}" >/dev/null 2>&1; then
            aws s3 cp "${SRC}" "${DST}"

            aws s3api put-object-tagging \
              --bucket genesis-cddev \
              --key "${S3_KEY_PREFIX}/${SCHEMA}-ARM-${EFFECTIVE_VERSION}.tar" \
              --tagging "TagSet=[{Key=Version,Value=${EFFECTIVE_VERSION}},{Key=Schema,Value=${SCHEMA}}${EFFECTIVE_CLIENT:+,{Key=Client,Value=${EFFECTIVE_CLIENT}}}]"

            echo "Tagged artifact created: ${DST}"
          else
            echo "::warning::Source tar not found at ${SRC}; skipping tag copy."
          fi
