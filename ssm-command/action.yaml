name: Send SSM comamnd to instances
description: Sends an SSM comamnd to the AWS instances based on the Environmnet tag

inputs:
  command:
    required: true
  run_on_all:
    required: false
    default: 'true'
    description: Set to true to run on all instances, false to run on the first instance only
  environment:
    required: true
  app_name:
    required: true
  aws-access-key-id:
    required: true
  aws-secret-access-key:
    required: true
  aws-region:
    required: true

runs:
  using: "composite"
  steps:
    - name: Configure AWS credentials
      if: ${{ inputs.aws-access-key-id != '' && inputs.aws-secret-access-key != '' }}
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}

    - name: Run SSM Command
      shell: bash
      env:
        RUN_ON_ALL: ${{ inputs.run_on_all }}
        ENVIRONMENT_TAG: ${{ inputs.environment }}
        COMMAND: ${{ inputs.command }}
        APP_NAME: ${{ inputs.app_name }}
      run: |
        # Get instance IDs with the specified Environment tag
        INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:EnvironmentName,Values=$ENVIRONMENT_TAG" "Name=tag:AppName,Values=$APP_NAME" "Name=tag:ServerType,Values=Genesis" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text)

        # Check if instances were found
        if [ -z "$INSTANCE_IDS" ]; then
            echo "No running instances Environment tag value '$ENVIRONMENT_TAG' and AppName tag value '$APP_NAME'."
            exit 1
        fi

        # If RUN_ON_ALL is false, only use the first instance
        if [[ "$RUN_ON_ALL" == "false" ]]; then
            INSTANCE_IDS=$(echo $INSTANCE_IDS | awk '{print $1}')
            echo "RUN_ON_ALL is false. Targeting only the first instance: $INSTANCE_IDS"
        else
            echo "Found instances: $INSTANCE_IDS"
        fi

        EXPORTS=$(env | awk -F= '{print "export " $1 "=\"" $2 "\""}' | tr '\n' ';')

        # Send the command via SSM
        COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=instanceIds,Values=$(echo $INSTANCE_IDS | tr ' ' ',')" \
            --parameters "commands=[\"$COMMAND\"]" \
            --comment "Running custom command on instances with Environment tag value '$ENVIRONMENT_TAG'" \
            --query "Command.CommandId" \
            --output text)

        if [ -z "$COMMAND_ID" ]; then
            echo "Failed to send SSM command."
            exit 2
        fi

        echo "Command sent. Command ID: $COMMAND_ID"

        # Wait for the command to complete and print concise progress while it runs.
        echo "Waiting for command to complete..."
        declare -A LAST_STDOUT_LENGTHS
        declare -A LAST_STDERR_LENGTHS
        declare -A LAST_REPORTED_STATUS

        print_invocation_output() {
            local instance_id="$1"
            local status output stderr output_len stderr_len last_output_len last_stderr_len new_output new_stderr

            status=$(aws ssm list-command-invocations \
                --command-id "$COMMAND_ID" \
                --instance-id "$instance_id" \
                --query "CommandInvocations[0].Status" \
                --output text 2>/dev/null || true)

            if [ -z "$status" ] || [ "$status" = "None" ]; then
                echo "Instance $instance_id: waiting for invocation details..."
                return
            fi

            output=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$instance_id" \
                --query "StandardOutputContent" \
                --output text 2>/dev/null || true)

            stderr=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$instance_id" \
                --query "StandardErrorContent" \
                --output text 2>/dev/null || true)

            if [ "${LAST_REPORTED_STATUS[$instance_id]:-}" != "$status" ]; then
                echo "Instance $instance_id status: $status"
                LAST_REPORTED_STATUS[$instance_id]="$status"
            fi

            output_len=${#output}
            stderr_len=${#stderr}
            last_output_len=${LAST_STDOUT_LENGTHS[$instance_id]:-0}
            last_stderr_len=${LAST_STDERR_LENGTHS[$instance_id]:-0}

            if [ "$output_len" -gt "$last_output_len" ]; then
                new_output="${output:$last_output_len}"
                echo "---- stdout tail ($instance_id) ----"
                printf '%s\n' "$new_output" | tail -n 5
                LAST_STDOUT_LENGTHS[$instance_id]=$output_len
            fi

            if [ "$stderr_len" -gt "$last_stderr_len" ]; then
                new_stderr="${stderr:$last_stderr_len}"
                echo "---- stderr ($instance_id) ----"
                printf '%s\n' "$new_stderr"
                LAST_STDERR_LENGTHS[$instance_id]=$stderr_len
            fi
        }

        while true; do
            ACTIVE=0
            for INSTANCE_ID in $INSTANCE_IDS; do
                STATUS=$(aws ssm list-command-invocations \
                    --command-id "$COMMAND_ID" \
                    --instance-id "$INSTANCE_ID" \
                    --query "CommandInvocations[0].Status" \
                    --output text 2>/dev/null || true)

                case "$STATUS" in
                    Pending|InProgress|Delayed|"")
                        ACTIVE=1
                        ;;
                esac

                print_invocation_output "$INSTANCE_ID"
            done

            if [ "$ACTIVE" -eq 1 ]; then
                echo "Command still running..."
                sleep 5
            else
                break
            fi
        done

        # Check the final status of each instance
        FAILED=0
        echo "Final statuses for instances:"
        for INSTANCE_ID in $INSTANCE_IDS; do
            STATUS=$(aws ssm list-command-invocations \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "CommandInvocations[0].Status" \
                --output text)

            echo "Instance $INSTANCE_ID: $STATUS"

            if [ "$STATUS" != "Success" ]; then
                FAILED=1
                echo "Fetching error output for instance $INSTANCE_ID..."
                ERROR_OUTPUT=$(aws ssm get-command-invocation \
                    --command-id "$COMMAND_ID" \
                    --instance-id "$INSTANCE_ID" \
                    --query "StandardErrorContent" \
                    --output text)
                echo "Error output for instance $INSTANCE_ID:"
                echo "$ERROR_OUTPUT"
            fi
        done

        if [ $FAILED -ne 0 ]; then
            echo "One or more instances failed to execute the command."
            exit 3
        fi

        echo "Command executed successfully on all instances."
