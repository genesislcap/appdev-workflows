name: Qaautomation execution of stages

inputs:
  working-directory:
    type: string
    default: .
    required: false

  testautomation_build:
    required: false
    default: false
    type: boolean
  testautorepo:
    required: false
    type: string
  testautobranch:
    required: false
    type: string
  web-path:
    required: false
    type: string
    default: 'client/web'
  server-path:
    required: false
    type: string
    default: 'server'
  additional_file:
    required: false
    type: string
    default: 'main-repo/.github/workflows/serverversion.properties'
  additional_webfile:
    required: false
    type: string
    default: 'main-repo/.github/workflows/webversion.properties'
  repo_type:
    required: false
    type: string
    default: 'server'

  GHA_TOKEN:
    required: true

runs:
  using: "composite"
  steps:

    - uses: actions/checkout@v3
      if: inputs.testautomation_build
      with:
        repository: ${{ inputs.testautorepo }}
        fetch-depth: '0'
        ref: ${{ inputs.testautobranch }}
        token: ${{ inputs.GHA_TOKEN }}

    - name: Checkout main repository
      if: inputs.testautomation_build
      uses: actions/checkout@v3
      with:
        repository: genesislcap/platform-qa-automation
        ref: ${{ github.ref }}
        token: ${{ inputs.GHA_TOKEN }}
        path: main-repo
        fetch-depth: 0

    - name: Print serverversion.properties file
      if: inputs.testautomation_build
      run: cat main-repo/.github/workflows/serverversion.properties
      shell: bash

    - name: Restore gradle.properties and setup
      env:
        working-directory: "${{ inputs.working-directory }}"
      shell: bash
      run: |
        mkdir -p ~/.gradle/
        echo "GRADLE_USER_HOME=${HOME}/.gradle" >> $GITHUB_ENV
        if [ "${{ inputs.testautomation_build }}" == "true" ]; then
          echo "Appending contents of additional file to gradle.properties"
          if [ -f "${{ inputs.working-directory }}/${{ inputs.additional_file }}" ]; then
            cat ${{ inputs.additional_file }} >> ~/.gradle/gradle.properties
          else
            echo "Additional file not found: ${{ inputs.additional_file }}" >&2
          fi
        fi
        echo "Contents of gradle.properties after modification:"
        cat ~/.gradle/gradle.properties

    - name: Extract gradle_version from additional file
      working-directory: "${{ inputs.working-directory }}"
      id: extract_gradle_version
      shell: bash
      run: |
        GRADLE_PROPERTIES_FILE="${{ inputs.working-directory }}/${{ inputs.additional_file }}"

        if grep -q "gradle_version" "$GRADLE_PROPERTIES_FILE"; then
          GRADLE_VERSION=$(grep 'gradle_version' "$GRADLE_PROPERTIES_FILE" | cut -d'=' -f2)
          echo "GRADLE_VERSION=$GRADLE_VERSION" >> $GITHUB_ENV
        else
          echo "gradle_version not found in additional file, skipping update."
          echo "GRADLE_VERSION=" >> $GITHUB_ENV
        fi

    - name: Update gradle-wrapper.properties with new gradle_version
      working-directory: "${{ inputs.working-directory }}"
      shell: bash
      run: |
        GRADLE_PROPERTIES_PATH="${{ inputs.working-directory }}/${{ inputs.server-path }}/gradle/wrapper/gradle-wrapper.properties"
        DEFAULT_GRADLE_PROPERTIES_PATH="${{ inputs.working-directory }}/gradle/wrapper/gradle-wrapper.properties"
        if [ -n "${{ env.GRADLE_VERSION }}" ]; then
          NEW_DISTRIBUTION_URL="distributionUrl=https\://services.gradle.org/distributions/gradle-${{ env.GRADLE_VERSION }}-bin.zip"

          if [ -f "$DEFAULT_GRADLE_PROPERTIES_PATH" ]; then
            sed -i "s|distributionUrl=.*|$NEW_DISTRIBUTION_URL|" "$DEFAULT_GRADLE_PROPERTIES_PATH"
            echo "Updated gradle-wrapper.properties:"
            cat "$DEFAULT_GRADLE_PROPERTIES_PATH"
          else
            echo "gradle-wrapper.properties not found!" >&2
            exit 1
          fi
          if [ -f "$GRADLE_PROPERTIES_PATH" ]; then
            sed -i "s|distributionUrl=.*|$NEW_DISTRIBUTION_URL|" "$GRADLE_PROPERTIES_PATH"
            echo "Updated gradle-wrapper.properties:"
            cat "$GRADLE_PROPERTIES_PATH"
          else
            echo "gradle-wrapper.properties not found!" >&2
            exit 1
          fi
        else
          echo "No gradle_version provided, skipping gradle-wrapper.properties update."
        fi
    # - name: Check file existence
    #   if: inputs.repo_type == 'web'
    #   id: web_exists
    #   working-directory: "${{ inputs.working-directory }}"
    #   shell: bash
    #   run: |
