name: Qaautomation execution of stages

inputs:
  working-directory:
    type: string
    default: .
    required: false

  testautomation_build:
    required: false
    default: false
    type: boolean
  testautorepo:
    required: false
    type: string
  testautobranch:
    required: false
    type: string
  web-path:
    required: false
    type: string
    default: 'client/web'
  server-path:
    required: false
    type: string
    default: 'server'
  additional_file:
    required: false
    type: string
    default: 'main-repo/.github/workflows/version.properties'
  repo_type:
    required: false
    type: string
    default: 'server'

  GHA_TOKEN:
    required: true

runs:
  using: "composite"
  steps:

    - uses: actions/checkout@v3
      if: inputs.testautomation_build
      with:
        repository: ${{ inputs.testautorepo }}
        fetch-depth: '0'
        ref: ${{ inputs.testautobranch }}
        token: ${{ inputs.GHA_TOKEN }}

    - name: Checkout main repository
      if: inputs.testautomation_build
      uses: actions/checkout@v3
      with:
        repository: genesislcap/platform-qa-automation
        ref: ${{ github.ref }}
        token: ${{ inputs.GHA_TOKEN }}
        path: main-repo
        fetch-depth: 0

    - name: Print version.properties file
      if: inputs.testautomation_build
      run: cat main-repo/.github/workflows/version.properties
      shell: bash

    - name: Restore gradle.properties and setup
      env:
        working-directory: "${{ inputs.working-directory }}"
      shell: bash
      run: |
        mkdir -p ~/.gradle/
        echo "GRADLE_USER_HOME=${HOME}/.gradle" >> $GITHUB_ENV
        if [ "${{ inputs.testautomation_build }}" == "true" ]; then
          echo "Appending contents of additional file to gradle.properties"
          if [ -f "${{ inputs.working-directory }}/${{ inputs.additional_file }}" ]; then
            cat ${{ inputs.additional_file }} >> ~/.gradle/gradle.properties
          else
            echo "Additional file not found: ${{ inputs.additional_file }}" >&2
          fi
        fi
        echo "Contents of gradle.properties after modification:"
        cat ~/.gradle/gradle.properties

    - name: Extract gradle_version from additional file
      working-directory: "${{ inputs.working-directory }}"
      id: extract_gradle_version
      shell: bash
      run: |
        GRADLE_PROPERTIES_FILE="${{ inputs.working-directory }}/${{ inputs.additional_file }}"

        if grep -q "gradle_version" "$GRADLE_PROPERTIES_FILE"; then
          GRADLE_VERSION=$(grep 'gradle_version' "$GRADLE_PROPERTIES_FILE" | cut -d'=' -f2)
          echo "GRADLE_VERSION=$GRADLE_VERSION" >> $GITHUB_ENV
        else
          echo "gradle_version not found in additional file, skipping update."
          echo "GRADLE_VERSION=" >> $GITHUB_ENV
        fi

    - name: Update gradle-wrapper.properties with new gradle_version
      working-directory: "${{ inputs.working-directory }}"
      shell: bash
      run: |
        GRADLE_PROPERTIES_PATH="${{ inputs.working-directory }}/${{ inputs.server-path }}/gradle/wrapper/gradle-wrapper.properties"
        DEFAULT_GRADLE_PROPERTIES_PATH="${{ inputs.working-directory }}/gradle/wrapper/gradle-wrapper.properties"
        if [ -n "${{ env.GRADLE_VERSION }}" ]; then
          NEW_DISTRIBUTION_URL="distributionUrl=https\://services.gradle.org/distributions/gradle-${{ env.GRADLE_VERSION }}-bin.zip"

          if [ -f "$DEFAULT_GRADLE_PROPERTIES_PATH" ]; then
            sed -i "s|distributionUrl=.*|$NEW_DISTRIBUTION_URL|" "$DEFAULT_GRADLE_PROPERTIES_PATH"
            echo "Updated gradle-wrapper.properties:"
            cat "$DEFAULT_GRADLE_PROPERTIES_PATH"
          else
            echo "gradle-wrapper.properties not found!" >&2
            exit 1
          fi
          if [ -f "$GRADLE_PROPERTIES_PATH" ]; then
            sed -i "s|distributionUrl=.*|$NEW_DISTRIBUTION_URL|" "$GRADLE_PROPERTIES_PATH"
            echo "Updated gradle-wrapper.properties:"
            cat "$GRADLE_PROPERTIES_PATH"
          else
            echo "gradle-wrapper.properties not found!" >&2
            exit 1
          fi
        else
          echo "No gradle_version provided, skipping gradle-wrapper.properties update."
        fi
    # - name: Check file existence
    #   if: inputs.repo_type == 'web'
    #   id: web_exists
    #   working-directory: "${{ inputs.working-directory }}"
    #   shell: bash
    #   run: |
    #     if test -d client; then
    #       echo "client_folder_exists=true" >> $GITHUB_OUTPUT
    #       CLIENT_BUILD_LOCATION="client"
    #     fi
    #     if test -d client/web; then
    #       CLIENT_BUILD_LOCATION="client/web"
    #     fi
    #     echo "::set-output name=modified-location::${CLIENT_BUILD_LOCATION}"
    #     CLIENT_BUILD_LOCATION=$(echo "${CLIENT_BUILD_LOCATION}" | sed 's/\//:/g')
    #     echo "::set-output name=modified-arguments-location::${CLIENT_BUILD_LOCATION}"

    - name: Read FOUNDATION_VERSION from additional file
      # if: steps.web_exists.outputs.client_folder_exists == 'true'
      working-directory: "${{ inputs.working-directory }}"
      id: extract_version
      shell: bash
      run: |
        if [ "${{ inputs.testautomation_build }}" == "true" ]; then
          # Extract FOUNDATION_VERSION from the additional file
          if grep -q "FOUNDATION_VERSION" ${{ inputs.working-directory }}/${{ inputs.additional_file }}; then
            FOUNDATION_VERSION=$(grep 'FOUNDATION_VERSION' ${{ inputs.working-directory }}/${{ inputs.additional_file }} | cut -d'=' -f2)
            echo "FOUNDATION_VERSION=$FOUNDATION_VERSION"
            echo "::set-output name=foundation_version::$FOUNDATION_VERSION"
          else
            echo "FOUNDATION_VERSION not found in additional file"
            exit 1
          fi
        fi
    - name: Check for package-lock.json and remove if exists
      # if: steps.web_exists.outputs.client_folder_exists == 'true'
      working-directory: "${{ inputs.working-directory }}/${{ inputs.web-path }}"
      shell: bash
      run: |
        if [ -f package-lock.json ]; then
          echo "Removing existing package-lock.json..."
          rm package-lock.json
        else
          echo "No package-lock.json found."
        fi


    - name: Update @genesislcap dependencies
      # if: steps.web_exists.outputs.client_folder_exists == 'true'
      working-directory: "${{ inputs.working-directory }}/${{ inputs.web-path }}"
      shell: bash
      run: |
        NEW_VERSION="${{ steps.extract_version.outputs.foundation_version }}"
        echo "${{ inputs.working-directory }}/${{ inputs.web-path }}"
        # Update @genesislcap dependencies across all objects in the package.json
        jq --arg version "$NEW_VERSION" '
          walk(
            if type == "object" then
              with_entries(
                if (.key | startswith("@genesislcap")) then .value = $version else . end
              )
            else . end
          )
        ' package.json > package.json.tmp

        # Move tmp file to overwrite the original package.json
          mv package.json.tmp package.json
        # Print the final updated package.json
        echo "Final updated package.json:"
        cat package.json

    - name: Update versions from version.properties into package.json (add missing too)
      shell: bash
      working-directory: "${{ inputs.working-directory }}"
      env:
        PACKAGE_JSON_PATH: "${{ inputs.working-directory }}/${{ inputs.web-path }}/package.json"
        INPUT_FILE_PATH:   "${{ inputs.working-directory }}/${{ inputs.additional_file }}"
        # Change to devDependencies or peerDependencies if you prefer
        ADD_TO_SECTION:    "dependencies"
      run: |
        set -euo pipefail
        if [ ! -f "${PACKAGE_JSON_PATH}" ]; then
          echo "package.json not found at ${PACKAGE_JSON_PATH}" >&2
          exit 1
        fi
        if [ ! -f "${INPUT_FILE_PATH}" ]; then
          echo "additional_file not found at ${INPUT_FILE_PATH}; skipping."
          exit 0
        fi

        tmpfile="$(mktemp)"
        cp "${PACKAGE_JSON_PATH}" "${tmpfile}"

        while IFS= read -r line; do
          [[ -z "$line" || "$line" =~ ^# ]] && continue

          if [[ "$line" =~ ^\"(.+)\":\ *\"(.+)\"$ ]]; then
            key="${BASH_REMATCH[1]}"; value="${BASH_REMATCH[2]}"
          else
            key="$(echo "$line" | cut -d'=' -f1 | xargs || true)"
            value="$(echo "$line" | cut -d'=' -f2- | xargs || true)"
          fi

          [ -z "${key}" ] && continue
          [ -z "${value}" ] && continue

          # If the key exists anywhere, update all occurrences; else add to ADD_TO_SECTION
          if jq -e --arg dep "$key" 'path(.. | objects | select(has($dep)))' "${tmpfile}" >/dev/null; then
            jq --arg dep "$key" --arg v "$value" '
              walk(
                if type=="object" and has($dep) then .[$dep]=$v else . end
              )
            ' "${tmpfile}" > "${tmpfile}.next"
          else
            jq --arg dep "$key" --arg v "$value" --arg section "$ADD_TO_SECTION" '
              if .[$section] == null then .[$section] = {} else . end
              | .[$section][$dep] = $v
            ' "${tmpfile}" > "${tmpfile}.next"
          fi
          mv "${tmpfile}.next" "${tmpfile}"
        done < "${INPUT_FILE_PATH}"

        mv "${tmpfile}" "${PACKAGE_JSON_PATH}"
        echo "Updated package.json:"
        cat "${PACKAGE_JSON_PATH}"

