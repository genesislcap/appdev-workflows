[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sendit-upload-and-dispatch"
version = "0.1.0"
description = "Upload files to tagged S3 bucket and trigger SendIt via repository_dispatch."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "boto3>=1.34.0,<2",
  "requests>=2.31.0,<3",
]

[project.scripts]
sendit-cli = "cli:main"

[tool.setuptools]
py-modules = ["cli"]
